name: OAEDataSchema
title: OAE Data Protocol - Technical Documentation
id: https://schema.oaedata.org/OAEDataSchema
version: 0.1.0
imports:
- linkml:types
- core
- enums
- dynamic_enums_expanded
- oae_project
- external_project
- monetary_grant
- permit
- experiment
- person
- variable
- dataset
- platform
- model
- instrument
- calibration
license: https://creativecommons.org/publicdomain/zero/1.0/
prefixes:
  oae:
    prefix_prefix: oae
    prefix_reference: https://schema.oaedata.org/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  dcat:
    prefix_prefix: dcat
    prefix_reference: http://www.w3.org/ns/dcat#
  envthes:
    prefix_prefix: envthes
    prefix_reference: https://w3id.org/envthes/
  PUBCHEM:
    prefix_prefix: PUBCHEM
    prefix_reference: https://pubchem.ncbi.nlm.nih.gov/compound/
  unit:
    prefix_prefix: unit
    prefix_reference: https://qudt.org/vocab/unit/
  SDN_L05:
    prefix_prefix: SDN_L05
    prefix_reference: http://vocab.nerc.ac.uk/collection/L05/current/
  SDN_L22:
    prefix_prefix: SDN_L22
    prefix_reference: http://vocab.nerc.ac.uk/collection/L22/current/
  SDN_B75:
    prefix_prefix: SDN_B75
    prefix_reference: http://vocab.nerc.ac.uk/collection/B75/current/
default_prefix: oae
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string.   If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  Doi:
    name: Doi
    definition_uri: https://schema.oaedata.org/Doi
    description: A Digital Object Identifier (DOI) for a digital object such as a
      document, dataset, or software package.
    title: DOI
    from_schema: Core
    base: str
    uri: xsd:string
enums:
  DatasetType:
    name: DatasetType
    definition_uri: https://schema.oaedata.org/DatasetType
    description: 'Type of dataset being submitted. This usually '
    from_schema: Enums
    permissible_values:
      dosing:
        text: dosing
        description: Variables such as dosing_onoff, dosing_rate, and flow_rate should
          be included here.
      cast:
        text: cast
        description: Vertical profiles (e.g., optical packages, CTD)
      bottle:
        text: bottle
        description: Any other types of measurements from water samples collected
          at discrete depths (e.g., nutrients)
      flow_thru:
        text: flow_thru
        description: Continuous data (e.g., shipboard, underway flow through system)
      pigment:
        text: pigment
        description: For laboratory measured pigment data (e.g. fluorometry, spectrophotometry,
          HPLC)
      marine_snow_catcher:
        text: marine_snow_catcher
        description: For various types of marine snow catcher data
      mooring:
        text: mooring
        description: Moored and buoy data
      drifter:
        text: drifter
        description: Drifter and drogue data
      airborne:
        text: airborne
        description: Measurements made via an aircraft
      diver:
        text: diver
        description: For measurements made by a diver
      auv:
        text: auv
        description: Measurements made by an autonomous underwater vehicle
      asv:
        text: asv
        description: Measurements made by an autonomous surface vehicle
      experimental:
        text: experimental
        description: Measurements that have a non-geospatial aspect (e.g., incubations
          or other laboratory measurements, etc.)
      sediment_trap:
        text: sediment_trap
        description: Measurements from a sediment trap platform
      taxonomy:
        text: taxonomy
        description: Data whose purpose is the classification or annotation of phytoplankton,
          zooplankton, or other marine groups.
      sediment:
        text: sediment
        description: Measurements from sediment samples (e.g., core samples, grab
          samples)
      model_output:
        text: model_output
        description: Data output from model experiments
      socioeconomic:
        text: socioeconomic
        description: Information (quantitative or qualitative) from socioeconomic
          studies
      net_tow:
        text: net_tow
        description: For measurements captured via net (e.g., zooplankton via MOCNESS)
      underway:
        text: underway
        description: Data collected continuously from a moving platform (e.g., ship
          underway system sampling surface seawater during transit).
      other:
        text: other
        description: For data types not included in the controlled vocabulary. Please
          fill in a the `dataset_type_custom` field with a more specific name for
          the custom mCDR data type.
  MCDRPathway:
    name: MCDRPathway
    definition_uri: https://schema.oaedata.org/MCDRPathway
    description: Type of marine Carbon Dioxide Removal (mCDR) pathways.
    title: MCDR Pathway
    from_schema: Enums
    permissible_values:
      ocean_alkalinity_enhancement:
        text: ocean_alkalinity_enhancement
        description: "Ocean Alkalinity Enhancement (OAE) is a method to help mitigate\
          \ climate change by increasing the alkalinity of seawater to enhance its\
          \ capacity to absorb and store atmospheric carbon dioxide (CO\u2082)."
        title: Ocean Alkalinity Enhancement
      biomass_sinking:
        text: biomass_sinking
        description: Biomass Sinking is a method that involves taking terrestrial
          or ocean biomass and sinking it into the deep ocean surface, subsurface,
          or anoxic basins, where it is sequestered. This can be accomplished by large-scale
          seaweed farming or macroalgae cultivation, which incorporates atmospheric
          CO2 as it grows, and then is sunk to the ocean floor. Alternatively, terrestrial
          plant biomass can be sunk to the ocean floor.
        title: Biomass Sinking
      direct_ocean_capture:
        text: direct_ocean_capture
        description: "Direct Ocean Capture (DOC) is a method that uses electrochemical\
          \ processes to remove dissolved carbon dioxide (CO\u2082) directly from\
          \ seawater for carbon storage or reuse."
        title: Direct Ocean Capture
      ocean_nutrient_fertilization:
        text: ocean_nutrient_fertilization
        description: "Ocean Fertilization is a method that involves adding nutrients,\
          \ such as iron, nitrogen, or phosphorus, to the ocean to stimulate the growth\
          \ of phytoplankton or other microscopic plants that absorb carbon dioxide\
          \ (CO\u2082) through photosynthesis."
        title: Ocean Nutrient Fertilization
      artificial_upwelling_downwelling:
        text: artificial_upwelling_downwelling
        description: Artificial Upwelling and Downwelling are mCDR methods that involve
          manipulating ocean water movement to enhance natural carbon sequestration
          processes.
        title: Artificial Upwelling and Downwelling
      marine_ecosystem_recovery:
        text: marine_ecosystem_recovery
        description: "Marine Ecosystem Recovery refers to the restoration and protection\
          \ of marine ecosystems to enhance their natural ability to capture and store\
          \ carbon dioxide (CO\u2082). This method leverages the natural carbon-sequestering\
          \ processes of marine habitats such as salt marshes, mangrove forests, coral\
          \ reefs, kelp forests, seagrass meadows, oyster beds, and deep-sea ecosystems,\
          \ aiming to rebuild biodiversity, ecosystem functions, and carbon storage\
          \ capacity."
        title: Marine Ecosystem Recovery
  ExperimentType:
    name: ExperimentType
    definition_uri: https://schema.oaedata.org/ExperimentType
    description: Types of mCDR experiments
    from_schema: Enums
    permissible_values:
      baseline:
        text: baseline
        description: Baseline measurements taken before any intervention
      control:
        text: control
        description: Control experiment without intervention for comparison
      intervention:
        text: intervention
        description: Experiment with active OAE intervention
      tracer_study:
        text: tracer_study
        description: Tracer study experiment (eg- dye or gas tracer study)
      model:
        text: model
        description: Model-based experiment or simulation
      other:
        text: other
        description: Other experiment type not covered by standard categories
  AlkalinityFeedstockProcessing:
    name: AlkalinityFeedstockProcessing
    definition_uri: https://schema.oaedata.org/AlkalinityFeedstockProcessing
    description: Methods used to process alkalinity feedstock
    from_schema: Enums
    permissible_values:
      electrochemistry:
        text: electrochemistry
        description: Alkalinity generated via electrochemical processes (e.g., seawater
          electrolysis).
      synthetically_derived:
        text: synthetically_derived
        description: Intentionally industrially manufactured chemical compounds (e.g.,
          Ca(OH)2 via lime kilns).
      mineral_mining:
        text: mineral_mining
        description: Mined geological material, including purified mineral or natural
          rock.
      blended:
        text: blended
        description: A mix of multiple sources.
      other:
        text: other
        description: Unclassified or novel; include a description in Experiment Description.
  AlkalinityFeedstockForm:
    name: AlkalinityFeedstockForm
    definition_uri: https://schema.oaedata.org/AlkalinityFeedstockForm
    description: Physical form of the alkalinity feedstock upon ocean delivery
    from_schema: Enums
    permissible_values:
      solid:
        text: solid
        description: Involves adding alkaline minerals or particulate slurry (such
          as MgOH2, MgO, or CaO) to seawater or river systems either directly, through
          coastal outfalls (such as wastewater), or at breaking shorelines to increase
          its alkalinity.
      aqueous:
        text: aqueous
        description: Aqueous alkalinity addition may use electrochemistry or fully
          dissolved mineral feedstock to increase seawater alkalinity.
      slurry:
        text: slurry
        description: Slurry alkalinity additions include a mix of solid and aqueous
          alkalinity forms, where the solid alkaline particulates are suspended in
          a solution.
  EquilibrationStatus:
    name: EquilibrationStatus
    definition_uri: https://schema.oaedata.org/EquilibrationStatus
    description: Equilibration status of the alkalinity feedstock
    from_schema: Enums
    permissible_values:
      pre_equilibrated:
        text: pre_equilibrated
        description: Pre-equilibrated with atmosphere before dosing
        title: Pre-equilibrated
      unequilibrated:
        text: unequilibrated
        description: Not pre-equilibrated before dosing
  HydrologicLocation:
    name: HydrologicLocation
    definition_uri: https://schema.oaedata.org/HydrologicLocation
    description: Hydrologic location types for dosing
    from_schema: Enums
    permissible_values:
      coastal_surface:
        text: coastal_surface
        description: Surface waters in coastal areas
        title: Coastal Surface
      offshore_surface:
        text: offshore_surface
        description: Surface waters in offshore areas
        title: Offshore Surface
      river:
        text: river
        description: River systems
      wetland:
        text: wetland
        description: Wetland areas
      seafloor:
        text: seafloor
        description: Seafloor or benthic zone
  DosingDeliveryType:
    name: DosingDeliveryType
    definition_uri: https://schema.oaedata.org/DosingDeliveryType
    description: Types of dosing delivery methods
    from_schema: Enums
    permissible_values:
      static_point_source:
        text: static_point_source
        description: A single dosing location such as an outflow from a static platform
          with a pipe
        title: Static Point Source
      variable_point_source:
        text: variable_point_source
        description: A mobile dosing regimen described by a single location at each
          time step, such as an outflow from a mobile platform such as a ship or surface
          vessel.
        title: Variable Point Source
      static_distributed:
        text: static_distributed
        description: A set location or locations of dosing that is not a point source,
          such as a distributed area over the seafloor or a diffusor.
        title: Static Distributed
      variable_distributed:
        text: variable_distributed
        description: A distributed dosing area that varies in time, such as manually
          placed alkaline material over different areas at different times.
        title: Variable Distributed
  TracerForm:
    name: TracerForm
    definition_uri: https://schema.oaedata.org/TracerForm
    description: Forms of tracer used in tracer studies
    from_schema: Enums
    permissible_values:
      gas:
        text: gas
        description: Gas tracer
      dye:
        text: dye
        description: Dye tracer (eg- rhodamine)
      other:
        text: other
        description: Other tracer form not covered by standard categories
  FeedstockType:
    name: FeedstockType
    definition_uri: https://schema.oaedata.org/FeedstockType
    description: 'Types of materials used for alkalinity addition, as sourced from
      NCEI''s OCADS controlled vocabulary: https://www.ncei.noaa.gov/access/ocean-carbon-acidification-data-system/vocabularies/alkalinization-types.html'
    from_schema: Enums
    permissible_values:
      lime:
        text: lime
        description: Lime (CaO) used as an alkalinity source.
        meaning: PUBCHEM:14778
      portlandite:
        text: portlandite
        description: "Portlandite (Ca(OH)\u2082) used as an alkalinity source."
        meaning: PUBCHEM:Portlandite
      calcium_carbonate:
        text: calcium_carbonate
        description: "Calcium carbonate (CaCO\u2083) used as an alkalinity source."
        meaning: PUBCHEM:10112
      anorthite:
        text: anorthite
        description: "Anorthite (CaAl\u2082Si\u2082O\u2088) used as an alkalinity\
          \ source."
        meaning: PUBCHEM:56843091
      dolomite:
        text: dolomite
        description: "Dolomite (CaMg(CO\u2083)\u2082) used as an alkalinity source."
        meaning: PUBCHEM:61833
      periclase:
        text: periclase
        description: Periclase (MgO) used as an alkalinity source.
        meaning: PUBCHEM:6850729
      brucite:
        text: brucite
        description: "Brucite (Mg(OH)\u2082) used as an alkalinity source."
        meaning: PUBCHEM:14791
      magnesite:
        text: magnesite
        description: "Magnesite (MgCO\u2083) used as an alkalinity source."
        meaning: PUBCHEM:11029
      forsterite:
        text: forsterite
        description: "Forsterite (Mg\u2082SiO\u2084) used as an alkalinity source."
        meaning: PUBCHEM:517737
      mg_rich_olivine:
        text: mg_rich_olivine
        description: Magnesium-rich olivine used as an alkalinity source.
        meaning: PUBCHEM:71586774
      sodium_hydroxide:
        text: sodium_hydroxide
        description: NaOH used as an alkalinity source.
        meaning: PUBCHEM:14798
      natrite:
        text: natrite
        description: "Natrite (Na\u2082CO\u2083) used as an alkalinity source."
        meaning: PUBCHEM:10340
      nahcolite:
        text: nahcolite
        description: "Nahcolite (NaHCO\u2083) used as an alkalinity source."
        meaning: PUBCHEM:516892
      other:
        text: other
        description: Enter a custom value in the field provided
  GridType:
    name: GridType
    definition_uri: https://schema.oaedata.org/GridType
    description: Type of grid in a multi-grid or nested model configuration
    from_schema: Enums
    permissible_values:
      inner_grid:
        text: inner_grid
        description: Inner (nested, higher-resolution) grid
      outer_grid:
        text: outer_grid
        description: Outer (coarser-resolution) grid
      single_grid:
        text: single_grid
        description: Single grid (no nesting)
  ModelComponentType:
    name: ModelComponentType
    definition_uri: https://schema.oaedata.org/ModelComponentType
    description: Type of model component
    from_schema: Enums
    permissible_values:
      physics:
        text: physics
        description: Physical model component (e.g., ocean circulation)
        title: Physics
      bgc_ecosystem:
        text: bgc_ecosystem
        description: Biogeochemical or ecosystem model component
        title: BGC / Ecosystem
      sea_ice:
        text: sea_ice
        description: Sea Ice model component
        title: Sea Ice
      atmosphere:
        text: atmosphere
        description: Atmosphere model component
        title: Atmosphere
      other:
        text: other
        description: Other model component (e.g., sea ice, sediment, atmosphere)
  DataProductType:
    name: DataProductType
    definition_uri: https://schema.oaedata.org/DataProductType
    from_schema: Enums
    permissible_values:
      originally_collected_dataset:
        text: originally_collected_dataset
        description: A dataset collected from a research cruise or laboratory experiment
      data_compilation_product:
        text: data_compilation_product
        description: (e.g., SOCAT, GLODAP)
