    usage_slot_name: name
    range: string
    required: true
  Dataset_description:
    name: Dataset_description
    definition_uri: https://schema.oaedata.org/description
    description: The abstract of a dataset is a brief summary that provides an overview
      of the dataset's content, purpose, and scope. It is used to provide context
      and background information to users who are interested in using the dataset.
      An abstract may include information such as the dataset's source, how the data
      was collected or generated, the variables or attributes included in the dataset,
      and any limitations or restrictions on the use of the data. It may also include
      information on how the data can be accessed or used.
    title: Description
    from_schema: Core
    mappings:
    - schema:description
    is_a: description
    domain: Dataset
    slot_uri: schema:description
    alias: description
    owner: Dataset
    domain_of:
    - Dataset
    is_usage_slot: true
    usage_slot_name: description
    range: string
    required: true
  Dataset_project_id:
    name: Dataset_project_id
    definition_uri: https://schema.oaedata.org/project_id
    description: 'The project to which the submitted data belong. A unique project
      identifier that can be used to link project data across data submissions, and
      link baseline data to intervention data, for example.

      If no Project ID has been assigned, one may be generated by combining: lead
      organizer surname and first initial or company, a unique date, and location.

      Any method that creates a unique ID that will link all project data is acceptable.'
    title: Project ID
    from_schema: Core
    is_a: project_id
    domain: Dataset
    slot_uri: oae:project_id
    alias: project_id
    owner: Dataset
    domain_of:
    - Dataset
    is_usage_slot: true
    usage_slot_name: project_id
    range: string
    required: true
  Dataset_experiment_id:
    name: Dataset_experiment_id
    definition_uri: https://schema.oaedata.org/experiment_id
    description: 'The experiment to which the data belong. Any naming convention that
      produces a unique ID is usable. The recommended naming convention is:

      Project ID + Experiment type + Optional numerical indicator to differentiate
      between various experiments of the same type for a project. A two digit consecutive
      number beginning with 01'
    title: Experiment ID
    from_schema: Core
    is_a: experiment_id
    domain: Dataset
    slot_uri: oae:experiment_id
    alias: experiment_id
    owner: Dataset
    domain_of:
    - Dataset
    is_usage_slot: true
    usage_slot_name: experiment_id
    range: string
    required: true
  ModelOutputDataset_filenames:
    name: ModelOutputDataset_filenames
    definition_uri: https://schema.oaedata.org/filenames
    title: Model Output Filenames
    from_schema: Dataset
    is_a: filenames
    domain: ModelOutputDataset
    slot_uri: oae:filenames
    alias: filenames
    owner: ModelOutputDataset
    domain_of:
    - ModelOutputDataset
    is_usage_slot: true
    usage_slot_name: filenames
    range: string
    required: true
    multivalued: true
    minimum_cardinality: 1
  Platform_name:
    name: Platform_name
    definition_uri: https://schema.oaedata.org/name
    description: Name of the observing platform, e.g., RV Ronald Brown, Saildrone#0132,
      Mooring_First_Landing, etc.
    title: Name
    from_schema: Core
    mappings:
    - schema:name
    is_a: name
    domain: Platform
    slot_uri: schema:name
    alias: name
    owner: Platform
    domain_of:
    - Platform
    is_usage_slot: true
    usage_slot_name: name
    range: string
  ModelComponent_description:
    name: ModelComponent_description
    definition_uri: https://schema.oaedata.org/description
    description: "A description of the model component characteristics.\nFor physics\
      \ components, this should include the version of equations being solved (hydrostatic\
      \ vs non-hydrostatic), tracer advection scheme, how bottom drag is represented,\
      \ mixed layer parameterizations, sub-grid mixing parameterizations if applicable,\
      \ etc.\nFor BGC components, this should include details of which parameters\
      \ are modeled explicitly, derived carbonate system parameters, advection scheme\
      \ for biological tracers, CO\u2082 solver protocol (e.g., CO\u2082SYS), links\
      \ to data/code with biological model parameters (e.g., growth and mortality\
      \ rates), etc. Equations for each explicitly modeled parameter should be provided\
      \ (can be links to publications), and it should be noted if any equations or\
      \ parameter values (e.g. growth rates) were modified. Description and/or references\
      \ of air-sea CO\u2082 flux parameterization used, gas transfer velocity formulation\
      \ and atmospheric CO\u2082 details (e.g., fixed or time varying, and if time\
      \ varying which data were used). Also include details on whether dissolution\
      \ and precipitation of calcium carbonate are considered, how exchanges between\
      \ sediment and overlying water are represented (if applicable), and whether\
      \ active feedbacks between biological processes and the carbonate system are\
      \ represented.\nAssociated links to data, DOIs, or publications can be noted\
      \ here, but should be supplemental."
    title: Model Component Description
    from_schema: Core
    mappings:
    - schema:description
    is_a: description
    domain: ModelComponent
    slot_uri: schema:description
    alias: description
    owner: ModelComponent
    domain_of:
    - ModelComponent
    is_usage_slot: true
    usage_slot_name: description
    range: string
  CO2GasDetector_instrument_type:
    name: CO2GasDetector_instrument_type
    from_schema: https://schema.oaedata.org/OAEDataSchema
    is_a: analyzingInstrument__instrument_type
    domain: CO2GasDetector
    slot_uri: oae:instrument_type
    alias: instrument_type
    owner: CO2GasDetector
    domain_of:
    - CO2GasDetector
    is_usage_slot: true
    usage_slot_name: instrument_type
    range: string
    required: true
    equals_string: gas_analyzer
  CO2GasDetector_manufacturer:
    name: CO2GasDetector_manufacturer
    definition_uri: https://schema.oaedata.org/manufacturer
    description: Manufacture of the CO2 sensor
    title: Manufacturer
    from_schema: Instrument
    is_a: manufacturer
    domain: CO2GasDetector
    slot_uri: oae:manufacturer
    alias: manufacturer
    owner: CO2GasDetector
    domain_of:
    - CO2GasDetector
    is_usage_slot: true
    usage_slot_name: manufacturer
    range: string
    required: true
  CO2GasDetector_model:
    name: CO2GasDetector_model
    definition_uri: https://schema.oaedata.org/model
    description: Model number of the CO2 sensor, e.g., 6262
    title: Model
    from_schema: Instrument
    is_a: model
    domain: CO2GasDetector
    slot_uri: oae:model
    alias: model
    owner: CO2GasDetector
    domain_of:
    - CO2GasDetector
    is_usage_slot: true
    usage_slot_name: model
    range: string
  TemperatureSensor_accuracy:
    name: TemperatureSensor_accuracy
    description: Accuracy of the temperature sensor in degrees Celsius.
    title: "Accuracy (\xB0C)"
    from_schema: https://schema.oaedata.org/OAEDataSchema
    is_a: genericSensor__accuracy
    domain: TemperatureSensor
    slot_uri: oae:accuracy
    alias: accuracy
    owner: TemperatureSensor
    domain_of:
    - TemperatureSensor
    is_usage_slot: true
    usage_slot_name: accuracy
    range: float
  TemperatureSensor_precision:
    name: TemperatureSensor_precision
    description: Precision of the temperature sensor in degrees Celsius.
    title: "Precision (\xB0C)"
    from_schema: https://schema.oaedata.org/OAEDataSchema
    is_a: genericSensor__precision
    domain: TemperatureSensor
    slot_uri: oae:precision
    alias: precision
    owner: TemperatureSensor
    domain_of:
    - TemperatureSensor
    is_usage_slot: true
    usage_slot_name: precision
    range: float
  PressureSensor_accuracy:
    name: PressureSensor_accuracy
    description: Accuracy of the pressure sensor in hectopascals (hPa).
    title: Accuracy (hPa)
    from_schema: https://schema.oaedata.org/OAEDataSchema
    is_a: genericSensor__accuracy
    domain: PressureSensor
    slot_uri: oae:accuracy
    alias: accuracy
    owner: PressureSensor
    domain_of:
    - PressureSensor
    is_usage_slot: true
    usage_slot_name: accuracy
    range: float
  PressureSensor_precision:
    name: PressureSensor_precision
    description: Precision of the pressure sensor in hectopascals (hPa).
    title: Precision (hPa)
    from_schema: https://schema.oaedata.org/OAEDataSchema
    is_a: genericSensor__precision
    domain: PressureSensor
    slot_uri: oae:precision
    alias: precision
    owner: PressureSensor
    domain_of:
    - PressureSensor
    is_usage_slot: true
    usage_slot_name: precision
    range: float
classes:
  Container:
    name: Container
    definition_uri: https://schema.oaedata.org/Container
    from_schema: https://schema.oaedata.org/OAEDataSchema
    slots:
    - container__project
    - container__experiments
    - container__datasets
    - container__version
    - container__protocol_git_hash
    - container__metadata_builder_git_hash
    attributes:
      project:
        name: project
        range: Project
      experiments:
        name: experiments
        range: Experiment
        multivalued: true
      datasets:
        name: datasets
        range: Dataset
        multivalued: true
      version:
        name: version
        description: Version of the oae-data-protocol
        range: string
        required: false
      protocol_git_hash:
        name: protocol_git_hash
        description: Git commit hash of the oae-data-protocol
        range: string
        required: false
      metadata_builder_git_hash:
        name: metadata_builder_git_hash
        description: Git commit hash of the metadata-builder UI
        range: string
        required: false
    class_uri: oae:Container
    tree_root: true
  PropertyValue:
    name: PropertyValue
    definition_uri: https://schema.oaedata.org/PropertyValue
    from_schema: Core
    mappings:
    - schema:PropertyValue
    class_uri: schema:PropertyValue
  Any:
    name: Any
    definition_uri: https://schema.oaedata.org/Any
    from_schema: Core
    mappings:
    - linkml:Any
    class_uri: linkml:Any
  Place:
    name: Place
    definition_uri: https://schema.oaedata.org/Place
    description: A geospatial area of interest, defined by a bounding box, polygon/line,
      or a point designated as a pair of geo-coordinates.
    from_schema: Core
    mappings:
    - schema:Place
    slots:
    - geo
    class_uri: schema:Place
  SpatialCoverage:
    name: SpatialCoverage
    definition_uri: https://schema.oaedata.org/SpatialCoverage
    description: A bounding box defined by latitude and longitude coordinates.
    from_schema: Core
    is_a: Place
    slots:
    - SpatialCoverage_geo
    slot_usage:
      geo:
        name: geo
        range: GeoShape
        required: true
    class_uri: oae:SpatialCoverage
  DosingLocation:
    name: DosingLocation
    definition_uri: https://schema.oaedata.org/DosingLocation
    description: A specific location of dosing for an OAE intervention and/or tracer
      study. Can be a point, line, or bounding box
    from_schema: Core
    is_a: Place
    slots:
    - geo
    - dosingLocation__dosing_location_file
    attributes:
      dosing_location_file:
        name: dosing_location_file
        description: Exact path and filename for the location file (relative to root
          path of project), attached separately. Format should be one of GeoJSON or
          Shapefile.
        range: string
    class_uri: oae:DosingLocation
  GeoShape:
    name: GeoShape
    definition_uri: https://schema.oaedata.org/GeoShape
    description: The geographic shape of a place. A GeoShape can be described using
      several properties whose values are based on latitude/longitude pairs. Either
      whitespace or commas can be used to separate latitude and longitude; whitespace
      should be used when writing a list of several such points. (imported from schema.org)
    from_schema: Core
    mappings:
    - schema:GeoShape
    slots:
    - geoShape__box
    - geoShape__line
    attributes:
      box:
        name: box
        description: "A bounding box defined by two corner points \u2014 the southwest\
          \ (lower-left) corner followed by the northeast (upper-right) corner. Per\
          \ science-on-schema.org, each point is written as `<latitude> <longitude>`\
          \ in decimal degrees (WGS 84), with all four values space-separated: `\"\
          <minLat> <minLon> <maxLat> <maxLon>\"`. Example: `\"39.3280 120.1633 40.445\
          \ 123.7878\"`. See https://github.com/ESIPFed/science-on-schema.org/blob/main/guides/Dataset.md#spatial-coverage"
        slot_uri: schema:box
        range: string
      line:
        name: line
        description: A line is a point-to-point path consisting of two or more points.
          A line is expressed as a series of two or more point objects separated by
          space.
        slot_uri: schema:line
        range: string
    class_uri: schema:GeoShape
  GeoCoordinates:
    name: GeoCoordinates
    definition_uri: https://schema.oaedata.org/GeoCoordinates
    description: A geographic coordinate in decimal degrees.
    from_schema: Core
    mappings:
    - schema:GeoCoordinates
    slots:
    - geoCoordinates__latitude
    - geoCoordinates__longitude
    attributes:
      latitude:
        name: latitude
        description: Latitude in decimal degrees of a location. For example 37.42242
          (WGS 84).
        title: Latitude
        slot_uri: schema:latitude
        range: float
        required: true
      longitude:
        name: longitude
        description: Longitude in decimal degrees of a location. For example -122.08585
          (WGS 84).
        title: Longitude
        slot_uri: schema:longitude
        range: float
        required: true
    class_uri: schema:GeoCoordinates
  VerticalExtent:
    name: VerticalExtent
    definition_uri: https://schema.oaedata.org/VerticalExtent
    description: The vertical extent of a place or structure in meters.
    from_schema: Core
    slots:
    - verticalExtent__min_depth_in_m
    - verticalExtent__max_depth_in_m
    - verticalExtent__min_height_in_m
    - verticalExtent__max_height_in_m
    attributes:
      min_depth_in_m:
        name: min_depth_in_m
        description: Minimum depth of observation in meters. Use negative numbers
          for depths below sea level.
        title: Minimum Depth (in meters)
        range: float
        maximum_value: 0
      max_depth_in_m:
        name: max_depth_in_m
        description: Maximum depth of observation in meters. Use negative numbers
          for depths below sea level.
        title: Maximum Depth (in meters)
        range: float
        maximum_value: 0
      min_height_in_m:
        name: min_height_in_m
        description: Minimum height of observation (in meters) for above ground aerial
          coverage.
        title: Minimum Height (in meters)
        range: float
        minimum_value: 0
      max_height_in_m:
        name: max_height_in_m
        description: Maximum height of observation (in meters) for above ground aerial
          coverage.
        title: Maximum Height (in meters)
        range: float
        minimum_value: 0
    class_uri: oae:VerticalExtent
  Organization:
    name: Organization
    definition_uri: https://schema.oaedata.org/Organization
    from_schema: Core
    mappings:
    - schema:Organization
    slots:
    - Organization_identifier
    - Organization_name
    - organization__country
    slot_usage:
      identifier:
        name: identifier
        description: Organization identifier in the form of an ROR URL (e.g., https://ror.org/02mhbdp94).
          Please visit [https://ror.org](https://ror.org) to search for the organization
          and find the appropriate ROR URL.
      name:
        name: name
        description: Name of the organization
        required: true
    attributes:
      country:
        name: country
        description: The country in which the organization belongs.
        title: Country
        range: string
    class_uri: schema:Organization
  Project:
    name: Project
    definition_uri: https://schema.oaedata.org/Project
    description: A project conducting OAE field trials or modeling.
    from_schema: Project
    broad_mappings:
    - schema:ResearchProject
    slots:
    - Project_project_id
    - Project_description
    - Project_temporal_coverage
    - Project_spatial_coverage
    - project__experiments
    - project__project_leads
    - project__sea_names
    - project__physical_site_description
    - project__social_context_site_description
    - project__social_research_conducted_to_date
    - project__mcdr_pathway
    - project__previous_or_ongoing_colocated_research
    - project__colocated_operations
    - project__research_project
    - project__funding
    - project__additional_details
    slot_usage:
      temporal_coverage:
        name: temporal_coverage
        description: The start and end date (optional) of the project
        required: true
      spatial_coverage:
        name: spatial_coverage
        required: true
      project_id:
        name: project_id
        required: true
      description:
        name: description
        description: 'A narrative description of the project. For example, what were
          the goals of the project? What were the research questions? What were the
          processes to achieve these goals and answer these questions? Who were the
          key stakeholders, organizers, project leaders? Was this building off a previous
          or ongoing project, or is this a new region/experiment/mechanistic study?

          If there are relevant regulatory parameters and/or limits to dosing trials
          at this location, these may be described here.'
        title: Project Description
        required: true
    attributes:
      experiments:
        name: experiments
        title: Related Experiments
        range: Experiment
        recommended: true
        multivalued: true
      project_leads:
        name: project_leads
        description: 'Provide details for each project lead / principal investigator
          (PI) including: Name, institutional information (name, address), phone,
          email, ID type (e.g., ORCID, etc), researcher ID, and role.'
        title: Project Lead(s)
        range: Person
        required: true
        multivalued: true
        inlined_as_list: true
      sea_names:
        name: sea_names
        description: Names of the seas where the data collection takes place, See
          Controlled Vocabularies section for definitions.
        title: Sea Names
        range: SeaNames
        recommended: true
        multivalued: true
      physical_site_description:
        name: physical_site_description
        description: 'Provide information to help characterize the field site and
          provide context when interpreting the data. For example, descriptions of
          tidal patterns, climatological conditions, notable geological characteristics,
          the geographical and marine setting (coastal, intertidal, island region,
          sheltered environment), and characteristic meteorological events. If possible
          based on the file type of this submission, please include useful maps or
          figures here.

          Links to relevant datasets, cruise reports, etc may be provided here.'
        title: Physical Site Description
        range: string
      social_context_site_description:
        name: social_context_site_description
        description: "Details may include:\n  - Commercial, recreational, ecological,\
          \ and cultural uses of study site\n  - Industrial site history\n  - Demographics\
          \ of site area\n  - Notable events that may impact local sentiment to mCDR\
          \ (for example: site had significant toxic spill in past decade, local positive\
          \ support for offshore wind farming, frequent HAB site) -Ecologically protected\
          \ species, economically significant operations in the marine environment\n\
          \  - In study areas with nearby state or federal jurisdiction borders, potential\
          \ conflicts with other countries or permits from foreign governments should\
          \ be described.\n  - Links to relevant social science surveys, engaged community\
          \ groups, etc."
        title: Social Context Site Description
        range: string
      social_research_conducted_to_date:
        name: social_research_conducted_to_date
        description: "A description of any social research conducted to date. If provided\
          \ as a separate file, list filename here. Information may include:\n  -\
          \ Description of Community engagement research approach conducted and results\n\
          \  - Stakeholder mapping method and link to output"
        title: Social Research Conducted to Date
        range: string
      mcdr_pathway:
        name: mcdr_pathway
        description: The Marine Carbon Dioxide Removal (MCDR) pathway being studied.
        title: MCDR Pathway
        range: MCDRPathway
        required: true
      previous_or_ongoing_colocated_research:
        name: previous_or_ongoing_colocated_research
        description: This field is required for co-located operations that potentially
          impact the project results. If previous or on-going mCDR field operations
          have occurred in the study domain by any project developer, they may be
          mentioned here either as a description, and/or if a reference to the study
          exists in the form of a data set, publication, etc, the DOI or other identifying
          information should be provided. Please provide direct links to data when
          available.
        title: Previous or Ongoing Co-located Research
        range: ExternalProject
        multivalued: true
      colocated_operations:
        name: colocated_operations
        description: A description is required if any nearby operations exist that
          may influence the waters over the time period covered by this data. This
          might be a nearby mCDR project, a facility that discharges water with different
          characteristics than the inflow (e.g., a desalination plant), frequent boating
          operations, etc.
        title: Co-located Operations
        range: string
      research_project:
        name: research_project
        description: Project, which the data collection is part of. For example, West
          Coast Ocean Acidification (WCOA) Project.
        title: Research Project
        range: string
      funding:
        name: funding
        description: Include the name of the funder, funder country, project title,
          project ID, and the project start and end dates. If there is no funding
          source (e.g., in the case of commercial projects), leave this field empty.
        title: Funding Info
        slot_uri: schema:funding
        range: MonetaryGrant
        multivalued: true
      additional_details:
        name: additional_details
        description: 'Open text area to include additional information. These may
          include information for sediment processes data, biological data, or any
          other required information if not included in the main metadata or data
          files.

          See [General Guidelines for Your Data](https://www.carbontosea.org/oae-data-protocol/1-0-0/#general-guidelines-for-your-data)
          for relevant sections of your data. Additional informational files, such
          as digitized laboratory notebooks, blogs, etc., may be linked here.'
        title: Additional Details
        range: string
    class_uri: oae:Project
  NamedLink:
    name: NamedLink
    definition_uri: https://schema.oaedata.org/NamedLink
    description: A link to a resource with a name and URL.
    from_schema: Project
    slots:
    - namedLink__name
    - namedLink__url
    attributes:
      name:
        name: name
        description: The name of the linked resource.
        title: Name
        range: string
        required: true
      url:
        name: url
        description: The URL of the linked resource.
        title: URL
        range: uri
        required: true
    class_uri: oae:NamedLink
  ExternalProject:
    name: ExternalProject
    definition_uri: https://schema.oaedata.org/ExternalProject
    description: A research project that is not directly managed by the OAE project,
      but whose location is proximal to the OAE project and whose data may be relevant
      to understanding the context or impacts of OAE activities.
    from_schema: ExternalProject
    slots:
    - temporal_coverage
    - spatial_coverage
    - externalProject__name
    - externalProject__description
    - externalProject__related_links
    attributes:
      name:
        name: name
        description: The name of the external research project.
        title: Name
        range: string
        required: true
      description:
        name: description
        description: A brief description of the external research project.
        title: Description
        range: string
      related_links:
        name: related_links
        description: Links to websites or documents related to the external research
          project.
        title: Related Links
        range: uri
        multivalued: true
    class_uri: oae:ExternalProject
  MonetaryGrant:
    name: MonetaryGrant
    definition_uri: https://schema.oaedata.org/MonetaryGrant
    from_schema: MonetaryGrant
    mappings:
    - schema:MonetaryGrant
    slots:
    - MonetaryGrant_name
    - MonetaryGrant_identifier
    - monetaryGrant__start_date
    - monetaryGrant__end_date
    - monetaryGrant__funder
    slot_usage:
      name:
        name: name
        description: Name of the grant
      identifier:
        name: identifier
        description: Unique identifier of the grant. Should be be URL or project id
          used by the funder
    attributes:
      start_date:
        name: start_date
        title: Start Date
        range: date
      end_date:
        name: end_date
        title: End Date
        range: date
      funder:
        name: funder
        title: Funder
        range: Organization
    class_uri: schema:MonetaryGrant
  Permit:
    name: Permit
    definition_uri: https://schema.oaedata.org/Permit
    description: A permit associated with the project.
    from_schema: Permit
    slots:
    - permit__permit_id
    - permit__permitting_authority
    - permit__agency_contact
    - permit__changes_to_evolution_of_permit_criteria
    - permit__permit_type
    - permit__time_period
    - permit__approval_document
    attributes:
      permit_id:
        name: permit_id
        description: The unique identifier or number associated with this permit.
        title: Permit ID or Number
        range: string
        required: true
      permitting_authority:
        name: permitting_authority
        description: The group that issued the permit.
        title: Permitting Authority
        range: string
        required: true
      agency_contact:
        name: agency_contact
        description: The point of contact at the permitting agency.
        title: Agency Contact
        range: string
      changes_to_evolution_of_permit_criteria:
        name: changes_to_evolution_of_permit_criteria
        description: e.g., changes of discharge pH and basis for changes
        title: Changes to evolution of permit criteria
        range: string
      permit_type:
        name: permit_type
        description: The category of permit (E.g., experimental permit, commercial
          permit)
        title: Permit Type
        range: string
      time_period:
        name: time_period
        description: The time period during which the permit will be applicable, or
          expected duration of the permit.
        title: Permit Time Period
        range: string
      approval_document:
        name: approval_document
        description: Filename(s) of permitting documents included, separated by commas
        title: Permit Document
        range: string
        required: true
    class_uri: oae:Permit
  Experiment:
    name: Experiment
    definition_uri: https://schema.oaedata.org/Experiment
    description: Abstract base class for all experiment types. Contains fields common
      to both in-situ and model experiments.
    from_schema: Experiment
    slots:
    - Experiment_name
    - Experiment_description
    - Experiment_spatial_coverage
    - Experiment_project_id
    - Experiment_experiment_id
    - experiment__experiment_types
    - experiment__public_comments
    - experiment__experiment_leads
    - experiment__start_datetime
    - experiment__end_datetime
    slot_usage:
      project_id:
        name: project_id
        required: true
      experiment_id:
        name: experiment_id
        required: true
      description:
        name: description
        description: A narrative description of the experiment. For example, what
          part of the project do these data represent (e.g., baseline, intervention,
          control) and what do they contribute to the overall project? Are all project
          research questions listed in Project description relevant? What were the
          processes to achieve these goals and answer these questions? Data submitters
          are encouraged to note any significant changes to the original experimental
          plan due to unforeseen circumstances here.
        title: Experiment Description
        required: true
      name:
        name: name
        description: Optional common name for experiment.
      spatial_coverage:
        name: spatial_coverage
        description: Latitude/longitude bounds of observed data in experiment, expressed
          as a schema.org GeoShape bounding box.
        required: true
    attributes:
      experiment_types:
        name: experiment_types
        description: The type(s) of mCDR experiment conducted. See Controlled Vocabularies
          section for definitions.
        title: mCDR Experiment Type(s)
        range: ExperimentType
        required: true
        multivalued: true
      public_comments:
        name: public_comments
        description: File name(s) of public comment related documents. If possible,
          please provide public comments concatenated into a single pdf
        title: Public Comments
        range: string
        recommended: true
      experiment_leads:
        name: experiment_leads
        description: 'Provide details for each experiment lead / principal investigator
          (PI) including: Name, institutional information (name, address), phone,
          email, ID type (e.g., ORCID, etc), researcher ID, and role.'
        title: Experiment Lead(s)
        range: Person
        required: true
        multivalued: true
        inlined_as_list: true
      start_datetime:
        name: start_datetime
        description: Start date and time of experiment in UTC ISO-8601
        title: Start Date and Time (UTC)
        range: datetime
        required: true
      end_datetime:
        name: end_datetime
        description: End date and time of experiment in UTC ISO-8601
        title: End Date and Time (UTC)
        range: datetime
    class_uri: oae:Experiment
  InSituExperiment:
    name: InSituExperiment
    definition_uri: https://schema.oaedata.org/InSituExperiment
    description: Experiment metadata for in-situ studies (interventions, tracer studies,
      etc.). Contains fields specific to field-based experiments that don't apply
      to model experiments.
    from_schema: Experiment
    is_a: Experiment
    slots:
    - Experiment_name
    - Experiment_description
    - Experiment_spatial_coverage
    - Experiment_project_id
    - Experiment_experiment_id
    - experiment__experiment_types
    - experiment__public_comments
    - experiment__experiment_leads
    - experiment__start_datetime
    - experiment__end_datetime
    - InSituExperiment_vertical_coverage
    - permits
    - inSituExperiment__data_conflicts_and_unreported_data
    - inSituExperiment__meteorological_and_tidal_data
    - inSituExperiment__additional_details
    slot_usage:
      vertical_coverage:
        name: vertical_coverage
        description: Minimum and maximum depths of observations in meters.
    attributes:
      data_conflicts_and_unreported_data:
        name: data_conflicts_and_unreported_data
        description: If data exist that are or have been used by the project but are
          not provided due to conflicts (e.g., geopolitical or other), data availability
          (e.g., a dataset is no longer available), it may be noted here.
        title: Data Conflicts and Unreported Data
        range: string
      meteorological_and_tidal_data:
        name: meteorological_and_tidal_data
        description: Include links to relevant open datasets if referenced in the
          experiment but not provided in the submission.
        title: Meteorological and Tidal Data
        range: NamedLink
        multivalued: true
        inlined_as_list: true
      additional_details:
        name: additional_details
        description: Open text area to include additional information. These may include
          information for sediment processes data, biological data, or any other required
          information if not included in the main metadata or data files; see General
          Guidelines for Your Data for relevant sections of your data. Additional
          informational files, such as digitized laboratory notebooks, blogs, etc.,
          may be linked here.
        title: Additional Details
        range: string
    class_uri: oae:InSituExperiment
  Intervention:
    name: Intervention
    definition_uri: https://schema.oaedata.org/Intervention
    description: Additional metadata that applies to experiments where an intervention,
      such as an alkalinity addition, was conducted.
    from_schema: Experiment
    is_a: InSituExperiment
