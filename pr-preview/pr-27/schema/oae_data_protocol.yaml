      sediment:
        text: sediment
        description: "Sediment variable \u2014 use with Discrete/ContinuousSedimentVariable\
          \ or CalculatedVariable"
      hplc:
        text: hplc
        description: "HPLC pigment analysis \u2014 use with HPLCVariable (always discrete,\
          \ always measured)"
      physiological:
        text: physiological
        description: "Physiological response variable \u2014 organism response data\
          \ from field experiments. Use with Discrete/ContinuousPhysiologicalVariable\
          \ or CalculatedVariable."
      socioeconomic:
        text: socioeconomic
        description: "Socioeconomic variable \u2014 social and economic data. Use\
          \ only with SocioeconomicVariable. Does not include QC fields."
      other:
        text: other
        description: Any directly measured or calculated variable that does not fall
          into a specific category above (e.g., temperature, salinity, conductivity,
          pressure, fluorescence). Use with DiscreteMeasuredVariable, ContinuousMeasuredVariable,
          or CalculatedVariable.
      non_measured:
        text: non_measured
        description: "Contextual or ancillary columns that are not directly measured\
          \ or calculated by the project \u2014 identifiers, timestamps, coordinates\
          \ and external source data. QC flag columns should NOT be listed as separate\
          \ variables; instead set dataset_variable_name_qc_flag on the parent variable.\
          \ Use only with NonMeasuredVariable."
