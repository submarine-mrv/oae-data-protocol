    - experiment__public_comments
    - experiment__experiment_leads
    - experiment__start_datetime
    - experiment__end_datetime
    - InSituExperiment_vertical_coverage
    - permits
    - inSituExperiment__data_conflicts_and_unreported_data
    - inSituExperiment__meteorological_and_tidal_data
    - inSituExperiment__additional_details
    - interventionDetails__alkalinity_feedstock_processing
    - interventionDetails__alkalinity_feedstock_processing_custom
    - interventionDetails__alkalinity_feedstock_form
    - interventionDetails__alkalinity_feedstock
    - interventionDetails__alkalinity_feedstock_custom
    - interventionDetails__alkalinity_feedstock_co2_removal_potential
    - interventionDetails__alkalinity_feedstock_description
    - interventionDetails__equilibration
    - interventionDetails__alkalinity_dosing_effluent_density
    - dosingDetails__dosing_delivery_type
    - dosingDetails__dosing_location
    - dosingDetails__dosing_dispersal_hydrologic_location
    - dosingDetails__dosing_depth
    - dosingDetails__dosing_regimen
    - dosingDetails__dosing_description
    - tracerDetails__tracer_form
