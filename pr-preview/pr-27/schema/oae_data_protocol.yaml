          \ or CalculatedVariable"
      dic:
        text: dic
        description: "Dissolved inorganic carbon \u2014 use with Discrete/ContinuousDICVariable\
          \ or CalculatedVariable"
      co2:
        text: co2
        description: "CO\u2082 variables (xCO\u2082, pCO\u2082, fCO\u2082) \u2014\
