    - platform__owner
    - platform__country
    slot_usage:
      name:
        name: name
        description: Name of the observing platform, e.g., RV Ronald Brown, Saildrone#0132,
          Mooring_First_Landing, etc.
    attributes:
      platform_type:
        name: platform_type
        description: 'Controlled vocabularies for the types of the platform: https://www.ncei.noaa.gov/access/ocean-carbon-acidification-data-system/vocabularies/platform-types.html'
        title: Platform Type
        range: PlatformType
        required: true
      platform_id:
        name: platform_id
        description: "Synonymous with glider ID, cruise ID. A unique name assigned\
          \ to oceanographic assets such as buoys, moorings, floats, drifters, towed\
          \ vehicles like the Scanfish or StingRay. This is synonymous with the BCO-DMO\
          \ \u201Cplatform\u201D parameter (https://www.bco-dmo.org/parameter/932),\
          \ NERC \u201Cplatform type\u201D term (https://vocab.nerc.ac.uk/collection/W06/current/CLSS0001/),\
          \ and the \u201Cplatform_id\u201D term within the Climate and Forecast (CF)\
          \ metadata conventions (https://cfconventions.org/Data/cf-standard-names/current/build/cf-standard-name-table.html).\
          \ e.g., ICES platform code (e.g., 33RO)."
        title: Platform ID
        range: string
      owner:
        name: owner
        description: Institution that owns the platform.
        title: Owner
        range: string
      country:
        name: country
        description: Country to which the platform belongs.
        title: Country
        range: string
    class_uri: oae:Platform
  Model:
    name: Model
    definition_uri: https://schema.oaedata.org/Model
    description: A computational model experiment related to OAE.
    from_schema: Model
    is_a: Experiment
    slots:
    - Experiment_name
