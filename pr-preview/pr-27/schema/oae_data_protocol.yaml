        range: uri
        multivalued: true
      model_components:
        name: model_components
        description: Components of the model (e.g., physics, biogeochemistry).
        title: Model Components
        range: ModelComponent
        multivalued: true
        inlined_as_list: true
      grid_details:
        name: grid_details
        description: Details about the model grid(s). Use multiple entries for nested
          grid configurations.
        title: Grid Details
        range: ModelGrid
        multivalued: true
        inlined_as_list: true
      spin_up_protocol:
        name: spin_up_protocol
        description: Description of the model spin-up process.
        title: Spin-up Protocol
        range: string
      time_stepping_scheme:
        name: time_stepping_scheme
        description: Time-stepping method and time step used in the simulation.
        title: Time-stepping Scheme
        range: string
    class_uri: oae:Model
  ModelComponent:
    name: ModelComponent
    definition_uri: https://schema.oaedata.org/ModelComponent
    description: A component of a model (e.g., physics, biogeochemistry/ecosystem).
    from_schema: Model
    slots:
    - ModelComponent_description
    - modelComponent__model_component_type
    - modelComponent__model_component_type_custom
    - modelComponent__name
    - modelComponent__version
    - modelComponent__codebase
    - modelComponent__references
    slot_usage:
      description:
        name: description
        description: "A description of the model component characteristics.\nFor physics\
          \ components, this should include the version of equations being solved\
          \ (hydrostatic vs non-hydrostatic), tracer advection scheme, how bottom\
          \ drag is represented, mixed layer parameterizations, sub-grid mixing parameterizations\
          \ if applicable, etc.\nFor BGC components, this should include details of\
          \ which parameters are modeled explicitly, derived carbonate system parameters,\
          \ advection scheme for biological tracers, CO\u2082 solver protocol (e.g.,\
          \ CO\u2082SYS), links to data/code with biological model parameters (e.g.,\
          \ growth and mortality rates), etc. Equations for each explicitly modeled\
          \ parameter should be provided (can be links to publications), and it should\
          \ be noted if any equations or parameter values (e.g. growth rates) were\
          \ modified. Description and/or references of air-sea CO\u2082 flux parameterization\
          \ used, gas transfer velocity formulation and atmospheric CO\u2082 details\
          \ (e.g., fixed or time varying, and if time varying which data were used).\
          \ Also include details on whether dissolution and precipitation of calcium\
          \ carbonate are considered, how exchanges between sediment and overlying\
          \ water are represented (if applicable), and whether active feedbacks between\
          \ biological processes and the carbonate system are represented.\nAssociated\
          \ links to data, DOIs, or publications can be noted here, but should be\
          \ supplemental."
        title: Model Component Description
    attributes:
      model_component_type:
        name: model_component_type
        description: The type of model component (physics, BGC/ecosystem, or other).
        title: Model Component Type
        range: ModelComponentType
        required: true
      model_component_type_custom:
        name: model_component_type_custom
        title: Model Component Type (custom)
        range: string
      name:
        name: name
        description: Name of the model component (e.g., ROMS, MARBL, Oceananigans).
        title: Component Name
        range: string
        required: true
      version:
        name: version
        description: Release version of the model component.
        title: Version
        range: string
      codebase:
        name: codebase
        description: Link to model code repository.
        title: Codebase
        range: uri
      references:
        name: references
        description: Links or DOIs to any reference(s) relevant to the model components/development,
          specific model configuration, model validation etc.
        title: References
        range: uri
        multivalued: true
    class_uri: oae:ModelComponent
    rules:
    - preconditions:
        slot_conditions:
          model_component_type:
            name: model_component_type
            equals_string: other
      postconditions:
        slot_conditions:
          model_component_type_custom:
            name: model_component_type_custom
            required: true
