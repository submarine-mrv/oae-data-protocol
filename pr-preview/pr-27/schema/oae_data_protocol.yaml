  SamplingInstrumentType:
    name: SamplingInstrumentType
    definition_uri: https://schema.oaedata.org/SamplingInstrumentType
    from_schema: Instrument
    permissible_values:
      ctd_rosette:
        text: ctd_rosette
        description: A CTD rosette consists of a metal frame that houses a collection
          of sensors and water sampling bottles (e.g., Niskin)
      niskin_bottle:
        text: niskin_bottle
        description: A device that collects an in-situ discrete water sample from
          any depth and returns it to the surface without contamination by the waters
          through which it passes, such as a water bottle.
        meaning: SDN_L05:30
      flow_through_system:
        text: flow_through_system
        description: A device that continuously supplies a flow of water either to
          an analytical instrument, over a sensor or from which samples may be drawn.
        meaning: SDN_L05:31
      flask_for_discrete_co2_measurement:
        text: flask_for_discrete_co2_measurement
        description: Such flasks are typically made of glass and have a capacity of
          around one liter. Seawater samples are collected from a specific depth using
          a Niskin bottle or other sampling device and transferred to the flask without
          exposing them to the air. The flask is then sealed with a stopper and transported
          to the laboratory for analysis.
      biological_trawl:
        text: biological_trawl
        description: A net towed through the water column designed to sample free-swimming
          nekton or fish
        meaning: SDN_L05:23
      phytoplankton_net:
        text: phytoplankton_net
        description: Phytoplankton net is used to collect and identify phytoplankton,
          which are microscopic plants that form the base of the marine food web.
        meaning: SDN_L05:22
      zooplankton_net:
        text: zooplankton_net
        description: Zooplankton net is used to collect and identify zooplankton,
          which are microscopic animals that feed on phytoplankton and are important
          prey for many marine organisms.
        meaning: SDN_L05:22
      edna_sampler:
        text: edna_sampler
        description: 'Environmental DNA (eDNA) samplers: used to collect and analyze
          genetic material shed by marine organisms, which can provide information
          about their distribution, abundance, and diversity.'
      autonomous_sensor:
        text: autonomous_sensor
        description: A device used in the measurement of a variety of oceanographic
          variables that functions autonomously
      other:
        text: other
  AnalyzingInstrumentType:
    name: AnalyzingInstrumentType
    definition_uri: https://schema.oaedata.org/AnalyzingInstrumentType
    from_schema: Instrument
    permissible_values:
      ctd_sensor:
        text: ctd_sensor
        description: A reusable instrument that always simultaneously measures conductivity
          and temperature (for salinity) and pressure (for depth).
        meaning: SDN_L05:130
      flow_through_system:
        text: flow_through_system
        description: A device that continuously supplies a flow of water either to
          an analytical instrument, over a sensor or from which samples may be drawn.
        meaning: SDN_L05:31
      thermosalinograph:
        text: thermosalinograph
        description: Temperature and conductivity sensors mounted on a sea-surface
          platform continuously measuring a surface water supply.
        meaning: SDN_L05:133
      salinometer_for_discrete_salinity_measurement:
        text: salinometer_for_discrete_salinity_measurement
        description: Instruments that measure the salinity of a collected water sample
          based on its electrical conductivity or optical properties.
        meaning: SDN_L05:LAB30
      dic_analyzers_based_on_coulometers:
        text: dic_analyzers_based_on_coulometers
        description: DIC coulometers are widely used in oceanographic research to
          measure the concentration of dissolved inorganic carbon in seawater samples.
          They are often coupled with computer-controlled automated dynamic headspace
          analyzers that extracts total carbon dioxide from seawater using Single-Operator
          Multiparameter Metabolic Analyzers (SOMMAs).
      dic_analyzers_based_on_co2_gas_detectors:
        text: dic_analyzers_based_on_co2_gas_detectors
        description: DIC analyzers based on a CO2 gas detector including Non-dispersive
          infrared absorption (NDIR) (e.g., Licor LI-850), Cavity Enhanced Absorption
          Spectroscopy (e.g., Licor's LI-7815), and Cavity Ring-Down Spectroscopy
          (CRDS) (e.g., Picarro G2131i) detectors.
      autonomous_dic_sensor:
        text: autonomous_dic_sensor
        description: Autonomous dissolved inorganic carbon (DIC) sensors are devices
          that can measure the concentration of DIC in seawater or other natural waters
          in situ, without the need for manual sampling and laboratory analysis.
        meaning: SDN_L05:86
      alkalinity_titrator:
        text: alkalinity_titrator
        description: An alkalinity titrator is a device used to measure the total
          alkalinity of a seawater by titration.
        meaning: SDN_L05:LAB12
      autonomous_ta_sensor:
        text: autonomous_ta_sensor
        description: Autonomous total alkalinity (TA) sensors are devices that can
          measure the concentration of TA in seawater or other natural waters in situ,
          without the need for manual sampling and laboratory analysis.
      showerhead_equilibrator:
        text: showerhead_equilibrator
        description: This type of equilibrator works by spraying seawater into a gas
          chamber, allowing the CO2 in the water to equilibrate with a gas mixture
          in the chamber.
        meaning: SDN_L05:EQUAL
      floating_air_water_equilibrator:
        text: floating_air_water_equilibrator
        description: An "h"-shaped bubble equilibrator assembly commonly used in MAPCO2
          systems on moorings. For more information, refer to Friederich et al. (1995).
        meaning: SDN_L05:EQUAL
      membrane_equilibrator:
        text: membrane_equilibrator
        description: While seawater is passed through a membrane, CO2 in the water
          diffuses across the membrane and equilibrates with the gas mixture, which
          is then analyzed to determine the CO2 concentration.
        meaning: SDN_L05:EQUAL
      spectrophotometer:
        text: spectrophotometer
        description: Instruments measuring the relative absorption of electromagnetic
          radiation of different wavelengths in the near infra-red, visible and ultraviolet
          wavebands by samples.
        meaning: SDN_L05:LAB20
      handheld_ph_spectrophotometer:
        text: handheld_ph_spectrophotometer
        description: One example of a handheld pH spectrophotometer is the "pHyter".
          Refer to Pardis et al. (2022) for more details.
      ph_electrode:
        text: ph_electrode
        description: A pH electrode, sometimes referred to as a pH probe or pH sensor,
          is a glass device used to measure the pH of a solution.
        meaning: SDN_L05:355
      sea_bird_seafet_v1:
        text: sea_bird_seafet_v1
        description: A pH sensor. The sensor can be used for ocean acidification,
          research coral reef sensitivity analysis and environmental monitoring. The
          sensor measures pH with a range of 6.5 to 9.0. The sensing element is an
          ion sensitive field effect transistor. The pH sensor has an initial accuracy
          of +/-0.05 pH, precision of 0.001 pH and stability of 0.005 pH/month. It
          can operate in temperatures ranging from 0 deg C to 50 deg C and up to depths
          of 50 m.
        meaning: SDN_L22:TOOL1292
      sea_bird_seafet_v2:
        text: sea_bird_seafet_v2
        description: A pH sensor. The sensor can be used for ocean acidification,
          research coral reef sensitivity analysis and environmental monitoring. The
          sensor measures pH with a range of 6.5 to 9.0. The sensing element is an
          ion sensitive field effect transistor. V2 implements improvements to the
          original SeaFET's reliability, data quality, ease of operation, and deployment
          endurance, with significant changes to how users interface with the instrument.
          The pH sensor has an accuracy to +/-0.05 pH, precision of 0.004 pH and stability
          of 0.003 pH/month. It can operate in temperatures ranging from 0 deg C to
          50 deg C and up to depths of 50 m.
        meaning: SDN_L22:TOOL1293
      oxygen_titrator:
        text: oxygen_titrator
        description: An oxygen titrator is a device used to measure the concentration
          of dissolved oxygen in a water sample, as required for the Winkler method.
        meaning: SDN_L05:LAB12
      oxygen_sensor:
        text: oxygen_sensor
        description: An oxygen sensor or probe or sond, is an electronic device that
          measures the concentration of dissolved oxygen in the ocean.
        meaning: SDN_L05:351
      sea_bird_seaphox:
        text: sea_bird_seaphox
        description: Sea-Bird SeapHOx is a type of oceanographic instrument that measures
          both the pH and dissolved oxygen concentration of seawater in real-time.
        meaning: SDN_L22:TOOL1895
      ysi:
        text: ysi
        description: YSI (Yellow Springs Instruments) is a company that produces a
          variety of water quality monitoring instruments. The YSI sensors are designed
          to measure a wide range of parameters, including temperature, salinity,
          and dissolved oxygen.
        meaning: SDN_B75:ORG00475
      nutrient_analyzer:
        text: nutrient_analyzer
        description: Instrument that makes in-situ measurements of one or more of
          nitrate, nitrite, ammonium, urea, phosphate or silicate dissolved in the
          water column.
        meaning: SDN_L05:181
      fluorometers:
        text: fluorometers
        description: Instrument that measures the amount of stimulated electromagnetic
          radiation produced by pulses of electromagnetic radiation emitted into the
          water column.
        meaning: SDN_L05:113
      high_performance_liquid_chromatography:
        text: high_performance_liquid_chromatography
        description: Instruments that separate and analyse mixtures of substances
          by high pressure pumping the sample through a column packed with microspheres
          coated with the stationary phase.
        meaning: SDN_L05:LAB11
      acoustic_doppler_current_profiler:
        text: acoustic_doppler_current_profiler
        description: Acoustic Doppler Current Profiler (ADCP), is a type of instrument
          used to measure water currents in oceans, rivers, and other bodies of water.
        meaning: SDN_L05:115
      mass_spectrometers:
        text: mass_spectrometers
        description: Instruments used to measure the mass-to-charge ratio of ions
          most generally used to find the composition of a sample by generating a
          mass spectrum representing the masses of sample components.
        meaning: SDN_L05:LAB16
      isotope_ratio_mass_spectrometers:
        text: isotope_ratio_mass_spectrometers
        description: Instruments that measure isotopic ratios using an electron ionisation
          source. Atoms in purified samples are ionised using a beam of electrons
          under vacuum. Subsequently, ions are focused into a beam by an electromagnet
          and then separated into individual beams based on their mass/charge ratio
        meaning: SDN_L05:LAB48
      barometric_pressure_sensor:
        text: barometric_pressure_sensor
        description: Instrument that makes routine meteorological measurements on
          the atmosphere, typically air pressure, temperature and humidity
        meaning: SDN_L05:102
      microscopes:
        text: microscopes
        description: Instruments that generate enlarged images of samples using the
          phenomena of reflection and absorption of visible light. Includes conventional
          and inverted instruments
        meaning: SDN_L05:LAB05
      scanning_electron_microscopes:
        text: scanning_electron_microscopes
        description: A scanning electron microscope (SEM) is a type of microscope
          that uses a focused beam of electrons to create high-resolution images of
          the surface of a specimen.
        meaning: SDN_L05:LAB07
      flow_cytometers:
        text: flow_cytometers
        description: Instruments that suspend cells in a stream of fluid past detection
          sensors whilst illuminating them with laser light. Used for cell counting,
          sorting, biomarker detection and protein engineering.
        meaning: SDN_L05:LAB37
      edna_sampler:
        text: edna_sampler
        description: 'Environmental DNA (eDNA) samplers: used to collect and analyze
          genetic material shed by marine organisms, which can provide information
          about their distribution, abundance, and diversity.'
      gas_analyzer:
        text: gas_analyzer
        description: TBD
      other:
        text: other
  CalibrationLocation:
    name: CalibrationLocation
    definition_uri: https://schema.oaedata.org/CalibrationLocation
    description: Where the calibration was performed.
    from_schema: Calibration
    permissible_values:
      factory:
        text: factory
        description: Factory calibration performed by manufacturer.
      lab:
        text: lab
        description: Laboratory calibration.
      field:
        text: field
        description: Field calibration performed during deployment.
