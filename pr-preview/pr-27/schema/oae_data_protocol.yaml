  Dataset:
    name: Dataset
    definition_uri: https://schema.oaedata.org/Dataset
    description: Abstract base class for all dataset types. Contains fields common
      to both field/observational and model simulation datasets. Generally following
      guidelines & best practices as outlined in [science-on-schema.org](https://github.com/ESIPFed/science-on-schema.org/blob/main/guides/Dataset.md)
    from_schema: Dataset
    exact_mappings:
    - schema:Dataset
    - dcat:Dataset
    slots:
    - Dataset_name
    - Dataset_description
    - Dataset_project_id
    - Dataset_experiment_id
    - filenames
    - dataset__dataset_type
    - dataset__dataset_type_custom
    - dataset__data_submitter
    - dataset__author_list_for_citation
    - dataset__license
    - dataset__fair_use_data_request
    - dataset__data_accessibility
    slot_usage:
      name:
        name: name
        description: 'A brief descriptive sentence that summarizes the content of
          a dataset. Here is one example:

          "Dissolved inorganic carbon, total alkalinity, pH, temperature, salinity
          and other variables collected from profile and discrete sample observations
          using CTD, Niskin bottle, and other instruments from R/V Wecoma in the U.S.
          West Coast California Current System during the 2011 West Coast Ocean Acidification
          Cruise (WCOA2011) from 2011-08-12 to 2011-08-30"'
        title: Dataset Title
        range: string
        required: true
      description:
        name: description
        description: The abstract of a dataset is a brief summary that provides an
          overview of the dataset's content, purpose, and scope. It is used to provide
          context and background information to users who are interested in using
          the dataset. An abstract may include information such as the dataset's source,
          how the data was collected or generated, the variables or attributes included
          in the dataset, and any limitations or restrictions on the use of the data.
          It may also include information on how the data can be accessed or used.
        range: string
        required: true
      project_id:
        name: project_id
        required: true
      experiment_id:
        name: experiment_id
        required: true
    attributes:
      dataset_type:
        name: dataset_type
        description: Selected controlled vocabularies for data types relevant to mCDR
          have been referenced from NASA's SeaBASS metadata system and are provided
          below, for additional data types of optical characteristics see the [SeaBASS
          controlled definitions list](https://seabass.gsfc.nasa.gov/wiki/metadataheaders#data_type).
          Additional data types have been included to meet the needs of mCDR field
          projects.
        title: Dataset Type
        range: DatasetType
        required: true
      dataset_type_custom:
        name: dataset_type_custom
        description: Custom "data type" when an appropriate value is not found in
          the controlled vocabulary list for mCDR Data Type and the corresponding
          `data_type` field is set to "other".
        title: Dataset Type (Custom)
        range: string
      data_submitter:
        name: data_submitter
        title: Data Submitter
        range: Person
        required: true
      author_list_for_citation:
        name: author_list_for_citation
        description: Author list in the format of Lastname1, Firstname1 Middlename1;
          Lastname2, Firstname2 Middlename2; ...
        title: Author List (for citation)
        range: string
      license:
        name: license
        description: Link a Dataset to its license to document legal constraints by
          adding a schema:license property. The guide recommends providing a URL that
          unambiguously identifies a specific version of the license used, but for
          many licenses it is hard to determine what that URL should be. Thus, we
          recommend that the license URL be drawn from the [SPDX license list](https://spdx.org/licenses/),
          which provides a curated list of licenses and their properties that is well
          maintained. For each SPDX entry, SPDX provides a canonical URL for the license
          (e.g., http://spdx.org/licenses/CC0-1.0), a unique licenseId (e.g., CC0-1.0),
          and other metadata about the license.
        title: License
        slot_uri: schema:license
        range: uri
      fair_use_data_request:
        name: fair_use_data_request
        description: A statement from the data producer regarding how this dataset
          should be used.
        title: Fair Use Data Request
        range: string
      data_accessibility:
        name: data_accessibility
        description: Level of access to this dataset. Open Access data are freely
          available without restriction. Conditional Access data are available upon
          request, subject to review. Scheduled Access data will become openly available
          after a specified date.
        title: Data Accessibility
        range: DataAccessibility
        required: true
    class_uri: oae:Dataset
  FieldDataset:
    name: FieldDataset
    definition_uri: https://schema.oaedata.org/FieldDataset
    description: A field or observational dataset related to an OAE experiment. Contains
      fields specific to in-situ data collection such as platform information, calibration
      files, QC flags, and measured variables.
    from_schema: Dataset
    is_a: Dataset
    slots:
    - Dataset_name
    - Dataset_description
    - Dataset_project_id
    - Dataset_experiment_id
    - filenames
    - dataset__dataset_type
    - dataset__dataset_type_custom
    - dataset__data_submitter
    - dataset__author_list_for_citation
    - dataset__license
    - dataset__fair_use_data_request
    - dataset__data_accessibility
    - temporal_coverage
    - fieldDataset__data_product_type
    - fieldDataset__qc_flag_scheme
    - fieldDataset__platform_info
    - fieldDataset__calibration_files
    - fieldDataset__variables
    attributes:
      data_product_type:
        name: data_product_type
        description: '"Controlled vocabulary" One of the three choices: (a) Originally
          collected dataset (e.g., a dataset collected from a research cruise or laboratory
          experiment), (b) Data compilation product (e.g., SOCAT, GLODAP), or (c)
          Derived product (e.g., gridded products, or model output).'
        title: Data Product Type
        range: DataProductType
        required: true
      qc_flag_scheme:
        name: qc_flag_scheme
        description: "Describe what the quality control flags stand for, e.g.,\n \
          \ 0 = interpolated or calculated data\n  1 = not evaluated/quality unknown\n\
          \  2 = acceptable\n  3 = questionable\n  4 = known bad\n  6 = median of\
          \ replicates\n  9 = missing value\""
        title: QC Flag Scheme
        range: string
      platform_info:
        name: platform_info
        title: Platform Information
        range: Platform
        required: true
      calibration_files:
        name: calibration_files
        description: A list of supplementary file names containing coefficients and
          techniques used to calibrate the instruments used in data collection. The
          named files can be found within the relevant documents folder accompanying
          the submitted data files.
        title: Calibration Files
        range: string
        multivalued: true
      variables:
        name: variables
        title: Variables
        slot_uri: schema:variableMeasured
        range: Variable
