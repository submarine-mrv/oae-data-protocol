id: OAEDataManagementProtocol
name: OAEDataManagementProtocol
# todo:
#   - "integrate with linkml-common for observation types"
version: 0.1.0
prefixes:
  schema: "http://schema.org/"
  oae: "https://example.org/oae#"
  linkml: "https://w3id.org/linkml/"
  dcat: "http://www.w3.org/ns/dcat#"
  envthes: "https://w3id.org/envthes/"
  PUBCHEM: "https://pubchem.ncbi.nlm.nih.gov/compound/"
default_prefix: oae

imports:
  - linkml:types
  - core
  - enums
  - dynamic_enums_expanded
  - oae_project
  - external_project
  - monetary_grant
  - experiment
  - person
  - permit
  - variable
  - dataset
  - platform
#   The following were early experimental schemas and have not been
#   udated to the v1.0 version of the protocol yet
#   - model_simulation

classes:
  Container:
    tree_root: true
    attributes:
      project:
        range: Project
      # TODO: Decide if version & git hashes should be required
      version:
        range: string
        description: "Version of the oae-data-protocol"
        required: false
      protocol_git_hash:
        range: string
        description: "Git commit hash of the oae-data-protocol"
        required: false
      metadata_builder_git_hash:
        range: string
        description: "Git commit hash of the metadata-builder UI"
        required: false
