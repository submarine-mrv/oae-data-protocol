id: https://schema.oaedata.org/OAEDataSchema
name: OAEDataSchema
title: "OAE Data Protocol - Technical Documentation"
# todo:
#   - "integrate with linkml-common for observation types"
version: 0.7.0
prefixes:
  oae: "https://schema.oaedata.org/"
  linkml: "https://w3id.org/linkml/"
  dcat: "http://www.w3.org/ns/dcat#"
  envthes: "https://w3id.org/envthes/"
  PUBCHEM: "https://pubchem.ncbi.nlm.nih.gov/compound/"
  # Declared here (in addition to the importing modules) so gen-python emits the
  # CurieNamespaces used by enum meanings — without them the datamodel fails to import.
  unit: "https://qudt.org/vocab/unit/"
  NVS_B75: "http://vocab.nerc.ac.uk/collection/B75/current/"
  NVS_C16: "http://vocab.nerc.ac.uk/collection/C16/current/"
  NVS_L05: "http://vocab.nerc.ac.uk/collection/L05/current/"
  NVS_L06: "http://vocab.nerc.ac.uk/collection/L06/current/"
  NVS_L22: "http://vocab.nerc.ac.uk/collection/L22/current/"
default_prefix: oae

imports:
  - linkml:types
  - core
  - enums
  - dynamic_enums_expanded
  - nvs_enums
  - oae_project
  - external_project
  - monetary_grant
  - permit
  - experiment
  - person
  - variable
  - dataset
  - platform
  - model

classes:
  Container:
    tree_root: true
    attributes:
      project:
        range: Project
      # TODO: Decide if version & git hashes should be required
      experiments:
        range: Experiment
        multivalued: true
      datasets:
        range: Dataset
        multivalued: true
      version:
        range: string
        description: "Version of the oae-data-protocol"
        required: false
      protocol_git_hash:
        range: string
        description: "Git commit hash of the oae-data-protocol"
        required: false
      metadata_builder_git_hash:
        range: string
        description: "Git commit hash of the metadata-builder UI"
        required: false
