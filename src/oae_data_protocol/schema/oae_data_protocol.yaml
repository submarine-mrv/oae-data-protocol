id: https://schema.oaedata.org/OAEDataSchema
name: OAEDataSchema
title: "OAE Data Protocol - Technical Documentation"
# todo:
#   - "integrate with linkml-common for observation types"
version: 0.7.0
prefixes:
  oae: "https://schema.oaedata.org/"
  linkml: "https://w3id.org/linkml/"
  dcat: "http://www.w3.org/ns/dcat#"
  envthes: "https://w3id.org/envthes/"
  PUBCHEM: "https://pubchem.ncbi.nlm.nih.gov/compound/"
  # Declared here (in addition to the importing modules) so gen-python emits the
  # CurieNamespaces used by enum meanings — without them the datamodel fails to import.
  unit: "https://qudt.org/vocab/unit/"
  "SDN_L05": "http://vocab.nerc.ac.uk/collection/L05/current/"
  "SDN_L22": "http://vocab.nerc.ac.uk/collection/L22/current/"
  "SDN_B75": "http://vocab.nerc.ac.uk/collection/B75/current/"
default_prefix: oae

imports:
  - linkml:types
  - core
  - enums
  - dynamic_enums_expanded
  - oae_project
  - external_project
  - monetary_grant
  - permit
  - experiment
  - person
  - variable
  - dataset
  - platform
  - model

classes:
  Container:
    tree_root: true
    attributes:
      project:
        range: Project
      experiments:
        range: Any
        # Listed by hand; tests/test_top_level_unions.py checks the list against the class tree.
        any_of:
          - range: Experiment
          - range: InSituExperiment
          - range: Model
          - range: Intervention
          - range: Tracer
          - range: InterventionWithTracer
        multivalued: true
      datasets:
        range: Any
        # Listed by hand; tests/test_top_level_unions.py checks the list against the class tree.
        any_of:
          - range: Dataset
          - range: FieldDataset
          - range: ModelOutputDataset
        multivalued: true
      protocol_version:
        range: string
        equals_string: "1.0.0"
        description: >-
          Version of the OAE Data Management Protocol the schema is based on: 1.0.0,
          https://doi.org/10.5281/zenodo.17154989.
        see_also:
          - https://doi.org/10.5281/zenodo.17154989
        required: false
      schema_version:
        range: string
        description: >-
          Version of the OAE Data Schema the file follows, such as 0.7.0, numbered separately from
          protocol_version. A file built from an unreleased commit reads 0.7.0+dev.3c014f73: the last release, then the commit.
        required: false
      metadata_builder_version:
        range: string
        description: >-
          Version of the Metadata Builder that wrote the file, in the same form as schema_version.
        required: false
