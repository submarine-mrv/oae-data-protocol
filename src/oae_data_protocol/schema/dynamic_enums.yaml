id: DynamicEnums
name: DynamicEnums

prefixes:
  oae: "https://schema.oaedata.org/"
  unit: "https://qudt.org/vocab/unit/"

default_prefix: oae
enums:
  SeaNames:
    matches:
      source_ontology: "SDN:C16"
      identifier_pattern: "http://vocab.nerc.ac.uk/collection/C16/current/.+/"
  PlatformType:
    matches:
      source_ontology: SDN:L06
      identifier_pattern: http://vocab.nerc.ac.uk/collection/L06/current/(62|3B|25|13|17|72|44|46|42|36|11|45|47|6A|67|71|10|14|15|26|38|3A|19|99|41|48|16|22|61|31|18|68|12|37|33|30|27|20|43|3C|3Z|23|6D|34)/
  MassConcentrationUnit:
    reachable_from:
      source_ontology: qudt:unit
      source_nodes:
        - quantitykind:MassConcentration
      relationship_types:
        - qudt:hasQuantityKind
