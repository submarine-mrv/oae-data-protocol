id: DynamicEnums
name: DynamicEnums

prefixes:
  oae: "https://example.org/oae#"
  unit: "https://qudt.org/vocab/unit/"

default_prefix: oae
enums:
  SeaNames:
    matches:
      source_ontology: "SDN:C16"
      identifier_pattern: "http://vocab.nerc.ac.uk/collection/C16/current/.+/"
  MassConcentration:
    reachable_from:
      source_ontology: qudt:unit
      source_nodes:
        - quantitykind:MassConcentration
      relationship_types:
        - qudt:hasQuantityKind