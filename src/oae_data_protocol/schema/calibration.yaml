id: Calibration
name: Calibration
description: >-
  Calibration type hierarchy for scientific instruments.
  See docs/dev/noaa-xsd-fields-not-included.md for XSD fields not yet included.

prefixes:
  oae: "https://schema.oaedata.org/"

default_prefix: oae

imports:
  - linkml:types

classes:
  # Base calibration class
  Calibration:
    description: >-
      Base calibration information for instruments.
    slots:
      - calibration_location
    attributes:
      technique_description:
        title: Calibration technique description
        description: Details of the calibration technique used.
        range: string
        required: true
      method_reference:
        title: Calibration method reference
        description: Citation or reference for the calibration method.
        range: string
      frequency:
        title: Frequency of calibration
        description: How often the instrument was calibrated.
        range: string
      last_calibration_date:
        title: Last calibration date (UTC)
        description: Date and time of most recent calibration in UTC.
        range: datetime
      calibration_certificates:
        title: Calibration certificate information
        description: >-
          Information about calibration certificates. Ideally, the certificate
          should be made available in a PDF file with filename listed here.
        range: string

  # CRM Calibration for DIC and TA instruments
  CRMCalibration:
    description: >-
      Calibration using Certified Reference Materials, used for DIC and TA instruments.
    is_a: Calibration
    attributes:
      crm_manufacturer:
        title: CRM manufacturer
        description: Manufacturer of the Certified Reference Material (e.g., Scripps, JAMSTEC).
        range: string
        required: true
      crm_batch_number:
        title: CRM batch number
        description: Batch number of the Certified Reference Material.
        range: string
        required: true

  # pH calibration. Dye standards use the DyeCalibration subclass.
  PHCalibration:
    description: >-
      pH instrument calibration. Use this class directly for TRIS or other standards,
      and DyeCalibration when standard_used is dye.
    is_a: Calibration
    slots:
      - calibration_temperature
      - standard_used
    rules:
      - preconditions:
          slot_conditions:
            standard_used:
              equals_string: "other"
        postconditions:
          slot_conditions:
            standard_used_custom:
              required: true
    attributes:
      standard_used_custom:
        title: Standard used (custom)
        description: Name of the standard used, when it is not in the list.
        range: string
      standard_type_and_production:
        title: Standard type and production
        description: Details on the standard (e.g., type of dye used) and how or where it was produced.
        range: string
      ph_of_standards:
        title: pH of standards
        description: pH values of the calibration standards used.
        range: string

  DyeCalibration:
    description: >-
      pH instrument calibration with an indicator dye standard.
    is_a: PHCalibration
    slot_usage:
      standard_used:
        range: string
        equals_string_in:
          - dye
    attributes:
      dye_purified:
        title: Dye purified
        description: Whether the dye has been purified.
        range: boolean
      correction_for_unpurified_dye:
        title: Correction for unpurified dye
        description: Correction method applied if dye was not purified.
        range: string
      dye_correction_method:
        title: Dye correction method
        description: Method used to correct for dye effects.
        range: string

  # CO2 Calibration base (shared by discrete and continuous)
  CO2Calibration:
    description: >-
      Base CO2 gas detector calibration with standard gas information.
    is_a: Calibration
    attributes:
      # TODO: Standard gas is an array in NOAA's OAPMetadata schema, can it be multivalued for us?
      standard_gas_info:
        title: Standard gas information
        description: Standard gases used for calibration.
        range: StandardGas

  # Discrete CO2 calibration (adds calibration temperature)
  DiscreteCO2Calibration:
    description: >-
      CO2 calibration for discrete measurements, with calibration temperature.
    is_a: CO2Calibration
    slots:
      - calibration_temperature

  # Continuous CO2 calibration (extended standard gas info, no calibration temperature)
  ContinuousCO2Calibration:
    description: >-
      CO2 calibration for continuous measurements, with extended standard gas details.
    is_a: CO2Calibration
    attributes:
      standard_gas_info:
        title: Standard gas information
        description: Standard gases used for calibration.
        range: ContinuousStandardGas

  # Supporting class for CO2 calibration
  StandardGas:
    description: >-
      Standard gas used for CO2 calibration.
    attributes:
      manufacturer:
        title: Standard Gas Manufacturer
        description: Manufacturer of the standard gas.
        range: string
      concentration:
        title: Standard Gas Concentration
        description: Concentrations of the CO2 standard gases that are used to calibrate the CO2 sensor, e.g., 260, 350, 510ppm.
        range: string
        # TODO: Change to DimensionedQuantity?
      uncertainty:
        title: Standard Gas Uncertainty
        description: Uncertainties of the CO2 standard gas, e.g., 0.5%.
        range: string
        # TODO: Change to DimensionedQuantity?

  # Extended standard gas for continuous CO2 calibration
  ContinuousStandardGas:
    description: >-
      Standard gas used for continuous CO2 calibration, with additional
      traceability and count information.
    is_a: StandardGas
    attributes:
      number_of_nonzero_standards:
        title: Number of non-zero gas standards
        description: How many non-zero gas standards were used for the calibration.
        range: integer
      traceability_to_wmo_standards:
        title: Traceability to WMO standards
        description: Information about traceability of standard gases to WMO standards.
        range: string

slots:
  standard_used:
    title: Standard used
    description: Type of standard used to calibrate the pH measurement.
    range: PHCalibrationStandard
    required: true
  calibration_location:
    title: Calibration location
    description: Factory calibration, lab calibration, or field calibration.
    range: CalibrationLocation
  calibration_temperature:
    title: Calibration temperature
    description: Temperature at which calibration was performed.
    range: string
    # TODO: Change to DimensionedQuantity?

enums:
  CalibrationLocation:
    description: Where the calibration was performed.
    permissible_values:
      factory:
        description: Factory calibration performed by manufacturer.
      lab:
        description: Laboratory calibration.
      field:
        description: Field calibration performed during deployment.
  PHCalibrationStandard:
    description: Standard used to calibrate a pH measurement.
    permissible_values:
      dye:
        title: Dye
        description: Indicator dye, e.g., m-cresol purple.
      tris:
        title: TRIS
        description: TRIS buffer in synthetic seawater.
      other:
        title: Other
        description: A standard not listed here. Name it in the custom field.
