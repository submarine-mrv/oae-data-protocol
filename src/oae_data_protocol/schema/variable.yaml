id: Variable
name: Variable

prefixes:
  oae: "https://example.org/oae#"
  schema: "http://schema.org/"

default_prefix: oae

imports:
  - linkml:types
  - instrument

classes:
  # =============================================================================
  # Base Variable Class (Abstract)
  # =============================================================================
  Variable:
    description: >-
      Abstract base class for all variable types. Contains common identification
      and description fields shared by all variables.
      Reference: OAPMetadata XSD variables.xsd - variable, basic_variable
    abstract: true
    attributes:
      variable_type:
        title: Variable Type
        description: >-
          The type of variable, used to determine which fields are applicable.
          This field acts as a discriminator for polymorphic variable types.
        designates_type: true
        range: string
        required: true
      column_header_name:
        title: Column header name
        description: >-
          The name for the variable as it is identified in the dataset data file.
          This could be the column header in a CSV or the variable name in a NetCDF file.
          Standard common recommended column header names can be found in protocol documentation 
          [here](https://www.carbontosea.org/oae-data-protocol/1-0-0/#column-header-name).
        range: string
        required: true
      long_name:
        title: Variable full name
        description: Full descriptive name of the variable.
        range: string
        required: true
      variable_unit:
        title: Unit
        description: Unit of measurement for this variable.
        range: string
        required: true
        # TODO: Upgrade this to controlled vocab with QUDT
      method_reference:
        title: Method Reference
        description: Citation for the method used.
        range: string
      measurement_researcher:
        title: Researcher who measured the variable
        description: The name of the PI whose research team measured or derived this parameter.
        range: Person
      other_detailed_information:
        title: Other Detailed Information
        description: Any additional information about this variable.
        range: string

  # =============================================================================
  # Measured Variable Class
  # =============================================================================
  MeasuredVariable:
    description: >-
      Variable that is directly measured in-situ using instruments.
      Reference: OAPMetadata XSD variables.xsd - basic_measured_observation_base
    is_a: Variable
    mixins:
      - QCFields
      - AnalyzingFields
    attributes:
      sampling_method:
        title: Sampling Method
        description: Method used to collect samples.
        range: string
        required: true
      analyzing_method:
        title: Analyzing Method
        description: Method used to analyze samples.
        range: string
        required: true

  # =============================================================================
  # Calculated Variable Class
  # =============================================================================
  CalculatedVariable:
    description: >-
      Variable that is calculated or derived from other variables.
    is_a: Variable
    mixins:
      - QCFields
    attributes:
      calculation_method_and_parameters:
        title: Calculated Method And Parameters
        description: >-
          Information about how the variable was calculated and the parameters used in calculation, e.g.:
          Calculation software = CO2SYSv1 (MATLAB) 
          Input variables =  pH and DIC (column header names 'ph_t_insitu' and 'dic' in associated dataset file)
          Additional information = the dissociation constants of Lueker et al., 2000 for carbonic acid, etc.
        range: string
        required: true

  # =============================================================================
  # DIC Variable Class
  # =============================================================================
  DICVariable:
    description: >-
      Dissolved Inorganic Carbon (DIC) measured variable.
      Uses CRM-calibrated instrument and includes sample preservation information.
      Reference: OAPMetadata XSD variables.xsd - DIC_measured
    is_a: MeasuredVariable
    mixins:
      - WeatherClimateFields
    slot_usage:
      analyzing_instrument:
        range: CRMInstrument
        description: CRM-calibrated instrument used to analyze DIC samples.
    attributes:
      sample_preservation:
        title: Sample preservation
        description: How the samples were preserved for DIC analysis.
        range: SamplePreservation
      blank_correction:
        title: Magnitude of blank correction
        description: The magnitude of the blank correction applied to the DIC measurements.
        range: string
        required: true

  # =============================================================================
  # CO2 Variable Classes
  # =============================================================================
  CO2Variable:
    description: >-
      Abstract base class for CO2 measured variables (both continuous and discrete).
      Reference: OAPMetadata XSD variables.xsd - co2_measured_base
    abstract: true
    is_a: MeasuredVariable
    mixins:
      - WeatherClimateFields
    slot_usage:
      analyzing_instrument:
        range: CO2GasDetector
        description: CO2 gas detector with standard gas calibration.
    attributes:
      water_vapor_correction:
        title: Water vapor correction
        description: Method used to correct for water vapor.
        range: string
        required: true
      temperature_correction_method:
        title: Temperature correction method
        description: Method used to correct CO2 for temperature.
        range: string
        required: true

  CO2ContinuousVariable:
    description: >-
      CO2 continuous (underway) measured variable.
      Reference: OAPMetadata XSD variables.xsd - co2_continuous
    is_a: CO2Variable
    mixins:
      - DiscreteOrContinuousFields
    attributes:
      co2_drying_method:
        title: CO2 drying method
        description: Method used to dry the CO2 sample.
        range: string
      xco2_pco2_calculation_method:
        title: xCO2 to pCO2 calculation method
        description: Method used to calculate pCO2 from xCO2.
        range: string
      pco2_fco2_calculation_method:
        title: pCO2 to fCO2 calculation method
        description: Method used to calculate fCO2 from pCO2.
        range: string
      # TODO: Add Equilibrator and SensorMeasurement fields in Phase 2
      # See docs/dev/noaa-xsd-fields-not-included.md

  CO2DiscreteVariable:
    description: >-
      CO2 discrete (bottle) measured variable.
      Reference: OAPMetadata XSD variables.xsd - co2_discrete
    is_a: CO2Variable
    attributes:
      storage_method:
        title: Storage method
        description: How samples were stored prior to analysis.
        range: string
        required: true
      seawater_volume:
        title: Seawater volume
        description: Volume of seawater in the sample.
        range: string
        required: true
        # TODO: Change to DimensionedQuantity in Phase 3
      headspace_volume:
        title: Headspace volume
        description: Volume of headspace in the sample container.
        range: string
        required: true
        # TODO: Change to DimensionedQuantity in Phase 3
      measurement_temperature:
        title: Measurement temperature
        description: Temperature at which CO2 was measured.
        range: string
        required: true
        # TODO: Change to DimensionedQuantity in Phase 3

  # =============================================================================
  # pH Variable Class
  # =============================================================================
  pHVariable:
    description: >-
      pH measured variable with dye-based spectrophotometric measurement.
      Reference: OAPMetadata XSD variables.xsd - pH_measured
    is_a: MeasuredVariable
    mixins:
      - WeatherClimateFields
    slot_usage:
      analyzing_instrument:
        range: pHInstrument
        description: pH instrument with dye-based calibration used for measurements.
    attributes:
      measurement_temperature:
        title: Measurement temperature
        description: Temperature at which pH was measured.
        range: string
        # TODO: Change to DimensionedQuantity in Phase 3
      temperature_correction_method:
        title: Temperature correction method
        description: Method used to correct pH for temperature.
        range: string
      ph_report_temperature:
        title: pH report temperature
        description: Temperature at which pH is reported.
        range: string
        required: true
        # TODO: Change to DimensionedQuantity in Phase 3

  # =============================================================================
  # TA Variable Class
  # =============================================================================
  TAVariable:
    description: >-
      Total Alkalinity (TA) measured variable. Extends DIC with TA-specific fields.
      Reference: OAPMetadata XSD variables.xsd - TA_measured
    is_a: DICVariable
    attributes:
      cell_type:
        title: Cell type
        description: Type of titration cell used for TA analysis (open or closed).
        range: string
        required: true
      curve_fitting:
        title: Curve fitting method
        description: The curve fitting method used for TA determination.
        range: string
        required: true

  # =============================================================================
  # HPLC Variable Class
  # =============================================================================
  HPLCVariable:
    description: >-
      HPLC (High-Performance Liquid Chromatography) measured variable for
      pigment analysis. Always measured, not calculated.
    is_a: MeasuredVariable
    attributes:
      # HPLC-specific fields to be added per Excel spec

  # =============================================================================
  # Sediment Variable Class
  # =============================================================================
  SedimentVariable:
    description: >-
      Sediment measured variable for seafloor/sediment sampling data.
    is_a: MeasuredVariable
    attributes:
      # Sediment-specific fields to be added per Excel spec

  # =============================================================================
  # Physiological Variable Class
  # =============================================================================
  PhysiologicalVariable:
    description: >-
      Physiological response measured variable for organism response data.
    is_a: MeasuredVariable
    attributes:
      # Physiological-specific fields to be added per Excel spec

  # =============================================================================
  # Socioeconomic Variable Class
  # =============================================================================
  SocioeconomicVariable:
    description: >-
      Socioeconomic variable for social and economic data.
      Note: Does NOT include QCFields mixin as QC is not applicable.
    is_a: Variable
    attributes:
      # Socioeconomic-specific fields to be added per Excel spec

  # =============================================================================
  # Non-Measured Variable Class
  # =============================================================================
  NonMeasuredVariable:
    description: >-
      Non-measured variable for data from external sources (e.g., satellite,
      model outputs, published data) that are not directly measured by the
      project but included in the dataset.
    is_a: Variable
    attributes:
      data_source:
        title: Data source
        description: Source of the non-measured data (e.g., satellite mission, model name).
        range: string
        required: true
      source_reference:
        title: Source reference
        description: Citation or DOI for the source data.
        range: string

  # =============================================================================
  # Supporting Classes for Variables
  # =============================================================================
  SamplePreservation:
    description: >-
      Sample preservation information for DIC and TA measurements.
      Reference: OAPMetadata XSD variables.xsd - sample_preservation
    attributes:
      preservative:
        title: Preservative used
        description: The preservative used to preserve the samples.
        range: string
        required: true
      volume:
        title: Preservative volume
        description: The volume of preservative used.
        range: string
        required: true
      correction_description:
        title: Preservative correction description
        description: Description of how the preservative effect was corrected for.
        range: string

  # =============================================================================
  # Generic Variable Class (Concrete)
  # =============================================================================
  GenericVariable:
    description: >-
      Generic concrete variable for cases that don't fit MeasuredVariable or
      CalculatedVariable. Provides backward compatibility and flexibility for
      variable types like socioeconomic data.
    is_a: Variable
    attributes:
      sampling_method:
        title: Sampling Method
        description: Method used to collect samples, if applicable.
        range: string
      analyzing_method:
        title: Analyzing Method
        description: Method used to analyze samples, if applicable.
        range: string

  # =============================================================================
  # Mixin Classes
  # =============================================================================

  # Quality Control Fields - All vars except socioeconomic
  QCFields:
    mixin: true
    description: >-
      Quality control fields applicable to measured and calculated variables.
      Not applied to socioeconomic variables.
    attributes:
      field_replicate_information:
        title: Field replicate information
        description: >-
          Repetition of sample collection and measurement, e.g., triplicate samples.
        range: string
      qc_steps_taken:
        title: QC steps taken
        description: >-
          Describe what QC steps have been taken to improve the quality of the data
          (e.g., DOI, software and settings used, outlier removal, etc.).
        range: string
        required: true
      uncertainty:
        title: Uncertainty
        description: >-
          It is recommended to provide uncertainty for each data point in the data file.
          Else provide a single value representative of the dataset.
        range: string
        # TODO: Change to VariableUncertainty in Phase 3
      uncertainty_definition:
        title: How was the uncertainty defined
        description: A description of the uncertainties involved in this method.
        range: string
        required: true
      missing_value_indicators:
        title: Missing value indicators
        description: >-
          The indicator used to represent missing values in the data file,
          e.g., -999, NaN, etc.
        range: string
        required: true
      qc_researcher:
        title: Researcher who QCed this variable
        description: The name of the PI whose research team QCed this parameter.
        range: Person
      qc_researcher_institution:
        title: QC Researcher Institution
        description: The institution of the PI whose research team QCed this parameter.
        range: string

  # Analyzing Instrument Fields - All vars except socioeconomic
  AnalyzingFields:
    mixin: true
    description: >-
      Analyzing instrument information fields. Applied to measured variables.
      The instrument type can be narrowed in subclasses using slot_usage.
    attributes:
      analyzing_instrument:
        title: Analyzing instrument
        description: >-
          Instrument used to analyze the water samples or measure the water body
          continuously. Instrument includes calibration information.
        range: Instrument
        required: true

  # Weather or Climate Quality Fields - Only DIC, pH, pCO2 (both), and TA
  WeatherClimateFields:
    mixin: true
    description: >-
      Weather or climate quality fields applicable only to DIC, pH, pCO2, and TA variables.
    attributes:
      weather_or_climate_quality:
        title: Weather or climate quality
        description: >-
          Climate quality is defined as measurements of quality sufficient to assess
          long-term trends. Weather quality is defined as measurements of quality
          sufficient to compare with satellite measurements and study regional
          air-sea CO2 flux.
        range: string
        # TODO: Change to AppropriateUseQuality enum in Phase 4

  # Discrete or Continuous Fields - All vars except HPLC, socioeconomic, disc pCO2 fCO2
  DiscreteOrContinuousFields:
    mixin: true
    description: >-
      Fields for discrete vs continuous measurement information.
      To be replaced by SamplingInfo choice structure in Phase 3.
    attributes:
      discrete_or_continuous:
        title: Discrete or continuous
        description: >-
          Whether the primary variables were measured based on discrete bottle or
          continuous measurements.
        range: string
        required: true
        # TODO: Replace with SamplingInfo choice structure in Phase 3
      raw_data_calculation_method:
        title: Method to calculate reported values from raw data
        description: The method used to calculate reported values from raw sensor data.
        range: string
        required: true
      calculation_software_version:
        title: Software version for the calculation
        description: Version of the software used to calculate reported values from raw values.
        range: string

  # =============================================================================
  # Deprecated Classes (kept for backward compatibility, will be removed)
  # =============================================================================

  # NOTE: AnalyzingInstrument and Calibration have been moved to instrument.yaml
  # and calibration.yaml respectively. These stub classes are kept temporarily
  # for any existing references but should be migrated to use the new types.

  AnalyzingInstrument:
    description: >-
      DEPRECATED: Use Instrument types from instrument.yaml instead.
      This class is kept for backward compatibility.
    deprecated: Use Instrument, CRMInstrument, pHInstrument, CO2GasDetector, or Sensor instead
    attributes:
      instrument_type:
        title: Analyzing instrument type
        range: string
        required: true
      manufacturer:
        title: Manufacturer
        range: string
      model:
        title: Model
        range: string
      serial_number:
        title: Serial number
        range: string
      precision:
        title: Precision
        range: string
        required: true
      accuracy:
        title: Accuracy
        range: string
        required: true

  # NOTE: CalibrationFields mixin is no longer needed as calibration is now
  # embedded in each instrument type. Left commented for reference.
  # CalibrationFields:
  #   mixin: true
  #   description: DEPRECATED - Calibration is now part of Instrument types.

  # NOTE: SamplingFields mixin functionality is now split:
  # - measured_or_calculated -> determined by MeasuredVariable vs CalculatedVariable
  # - calculation_method_and_parameters -> moved to CalculatedVariable
  # Left commented for reference.
  # SamplingFields:
  #   mixin: true
  #   description: DEPRECATED - Use MeasuredVariable or CalculatedVariable instead.