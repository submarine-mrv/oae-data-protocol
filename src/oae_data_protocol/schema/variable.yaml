id: Variable
name: Variable

prefixes:
  oae: "https://schema.oaedata.org/"
  schema: "http://schema.org/"

default_prefix: oae

imports:
  - linkml:types
  - instrument

classes:
  # ==============================================================================
  # Variable Abstract Class (subclasses: InSituVariable, NonMeasuredVariable)
  # ==============================================================================
  Variable:
    abstract: true
    description: Abstract root for all variable types (including non-measured)
    slots:
      - units
      - variable_type
    slot_usage:
      variable_type:
        required: true
    attributes:
      schema_class:
        designates_type: true
        range: string
        required: true
        description: >-
          The schema class name for this variable (e.g., "DiscretePHVariable").
          Auto-populated by the metadata builder.
      standard_identifier:
        range: VocabularyItemReference
      dataset_variable_name:
        title: Dataset variable name
        description: >-
          The name for the variable as it is identified in the dataset data file.
          This could be the column header in a CSV or the variable name in a NetCDF file.
          Standard common recommended column header names can be found in protocol documentation
          [here](https://www.carbontosea.org/oae-data-protocol/1-0-0/#column-header-name).
        range: string
        required: true
      long_name:
        title: Variable full name
        description: Full descriptive name of the variable.
        range: string
        required: true

  # =============================================================================
  # Field Variable Class (abstract root of everything a FieldDataset may hold)
  # =============================================================================
  FieldVariable:
    abstract: true
    description: >-
      Abstract root for every variable that can appear in a FieldDataset —
      measured, calculated or contextual. Exists so FieldDataset.variables can
      range over exactly these classes: ranging over Variable would also admit
      ModelVariable, which belongs only to a ModelOutputDataset.
    is_a: Variable

  # =============================================================================
  # Non-Measured Variable Class
  # =============================================================================
  NonMeasuredVariable:
    description: >-
      A contextual or ancillary variable that is NOT directly measured or
      calculated by the project. Use for identifiers (Cruise_ID, Exp_ID),
      timestamps (Year_UTC, Time_UTC), coordinates (Latitude, Longitude),
      and any other data included in the dataset for context.
      Do NOT create a NonMeasuredVariable for quality control flag columns —
      instead, set dataset_variable_name_qc_flag on the parent measured or
      calculated variable that the flag relates to. variable_type must be
      "non_measured".
    is_a: FieldVariable
    slot_usage:
      variable_type:
        range: string
        equals_string: "non_measured"

  # =============================================================================
  # InSituVariable Class (subclasses: MeasuredVariable, CalculatedVariable)
  # =============================================================================
  InSituVariable:
    abstract: true
    description: >-
      Base class for project-acquired variables (measured or calculated in-situ).
      Reference: OAPMetadata XSD variables.xsd - insitu_variable
    is_a: FieldVariable
    slot_usage:
      units:
        required: true
    attributes:
      genesis:
        range: GenesisType
        required: true
      dataset_variable_name_qc_flag:
        title: Dataset variable name (Quality Flag)
        description: >-
          If applicable, the column header name used for the quality control flag corresponding to this variable.
        range: string
      dataset_variable_name_raw:
        title: Dataset variable name (raw)
        description: >-
          If applicable, the column header name used for the raw data corresponding to this variable.
        range: string
      other_detailed_information:
        title: Other Detailed Information
        description: Any additional information about this variable.
        range: string


  # =====================================================================================
  # MeasuredVariable Class (subclasses: DiscreteMeasuredVariable, ContinuousMeasuredVariable)
  # =====================================================================================
  MeasuredVariable:
    abstract: true
    description: >-
      Variable that is directly measured in-situ using instruments.
      Reference: OAPMetadata XSD variables.xsd - basic_measured_observation_base
    is_a: InSituVariable
    mixins:
      - QCFields
      - FieldMeasurementFields
    slots:
      - analyzing_instrument
    slot_usage:
      qc_steps_taken:
        required: true
      uncertainty:
        required: true
      uncertainty_definition:
        required: true
      missing_value_indicators:
        required: true
      genesis:
        range: string
        equals_string: "measured"
    attributes:
      sampling_method:
        title: Sampling Method
        description: Method used to collect samples.
        range: string
        required: true
      field_replicate_information:
        title: Field replicate information
        description: >-
          Repetition of sample collection and measurement, e.g., triplicate samples.
        range: string
      analyzing_method:
        title: Analyzing Method
        description: Additional information describing how the sample was analyzed. DOIs provided as applicable.
        range: string
        required: true
      observation_type:
        title: Observation Type
        range: ObservationType
        required: true
      sampling:
        range: SamplingType
        required: true
      sampling_instrument_type:
        title: Sampling instrument type
        range: SamplingInstrumentType
        required: true
      sampling_instrument_type_custom:
        title: Sampling instrument type (custom)
        range: string

  # =============================================================================
  # DiscreteMeasuredVariable Class (pH, DIC, TA, pCO2/fCO2, physiological, sediment, HPLC)
  # =============================================================================
  DiscreteMeasuredVariable:
    is_a: MeasuredVariable
    description: >-
      A variable measured in-situ from discrete water samples (e.g., bottle
      samples analyzed in a lab or shipboard). Use this class for generic
      measured variables that do not fall under a specific category (pH, TA,
      DIC, CO2, sediment, HPLC). For those, use the type-specific subclass
      instead (e.g., DiscretePHVariable). Set variable_type to "other",
      genesis to "measured", and sampling to "discrete".
    slot_usage:
      sampling:
        range: string
        equals_string: "discrete"

  # =============================================================================
  # ContinuousMeasuredVariable Class (pH, DIC, TA, xCO2/pCO2/fCO2, physiological, sediment)
  # =============================================================================
  ContinuousMeasuredVariable:
    is_a: MeasuredVariable
    description: >-
      A variable measured in-situ by a continuous autonomous sensor (e.g.,
      temperature, salinity, conductivity, pressure from a deployed sonde
      or underway system). Use this class for generic measured variables
      that do not fall under a specific category (pH, TA, DIC, CO2,
      sediment). For those, use the type-specific subclass instead (e.g.,
      ContinuousPHVariable). Set variable_type to "other", genesis to
      "measured", and sampling to "continuous".
    slot_usage:
      sampling:
        range: string
        equals_string: "continuous"
    attributes:
      raw_data_calculation_method:
        title: Method to calculate reported values from raw data
        description: The method used to calculate reported values from raw sensor data.
        range: string
        required: true
      calculation_software_version:
        title: Software version for the calculation
        description: Version of the software used to calculate reported values from raw values.
        range: string

  # =============================================================================
  # Calculated Variable Class
  # =============================================================================
  CalculatedVariable:
    description: >-
      A variable that is calculated or derived from other measured variables
      rather than directly measured by an instrument (e.g., carbonate system
      parameters computed via CO2SYS). Set genesis to "calculated".
      The variable_type should reflect the quantity being calculated (e.g., "pH",
      "ta", "dic", "co2", or "other").
    is_a: InSituVariable
    mixins:
      - QCFields
      - FieldMeasurementFields
    slot_usage:
      genesis:
        range: string
        equals_string: "calculated"
    attributes:
      calculation_method_and_parameters:
        title: Calculated Method And Parameters
        description: >-
          Information about how the variable was calculated and the parameters used in calculation, e.g.:
          Calculation software = CO2SYSv1 (MATLAB)
          Input variables =  pH and DIC (column header names 'ph_t_insitu' and 'dic' in associated dataset file)
          Additional information = the dissociation constants of Lueker et al., 2000 for carbonic acid, etc.
        range: string
        required: true

  # =============================================================================
  # pH Variable Classes
  # =============================================================================

  ContinuousPHVariable:
    description: >-
      pH measured variable from continuous autonomous sensor
    is_a: ContinuousMeasuredVariable
    mixins:
      - MeasuredPHFields
    slot_usage:
      variable_type:
        range: string
        equals_string: "pH"

  DiscretePHVariable:
    description: >-
      pH measured variable with dye-based spectrophotometric measurement.
      Reference: OAPMetadata XSD variables.xsd - pH_measured
    is_a: DiscreteMeasuredVariable
    mixins:
      - MeasuredPHFields
    slot_usage:
      variable_type:
        range: string
        equals_string: "pH"
      analyzing_instrument:
        range: PHInstrument
        description: pH instrument with dye-based calibration used for measurements.
    attributes:
      measurement_temperature:
        title: Temperature at which pH was measured
        description: Temperature at which pH was measured.
        range: string
        required: true
        # TODO: Change to DimensionedQuantity in Phase 3
      temperature_correction_method:
        title: Temperature correction method
        description: Method used to correct pH for temperature.
        range: string
      ph_reported_temperature:
        title: Temperature at which pH was reported
        description: The input could be a constant temperature value, or something like, in-situ temperature, temperature of analysis, etc.
        range: string
        required: true
        # TODO: Change to DimensionedQuantity in Phase 3

  # =============================================================================
  # TA Variable Class
  # =============================================================================
  ContinuousTAVariable:
    description: >-
      Total Alkalinity (TA) measured variable from continuous autonomous sensor
    is_a: ContinuousMeasuredVariable
    mixins:
      - MeasuredTAFields
    slot_usage:
      variable_type:
        range: string
        equals_string: "ta"

  DiscreteTAVariable:
    description: >-
      Total Alkalinity (TA) measured variable from discrete bottle samples
    is_a: DiscreteMeasuredVariable
    mixins:
      - MeasuredTAFields
    slots:
      - sample_preservation
      - blank_correction
    slot_usage:
      variable_type:
        range: string
        equals_string: "ta"
      analyzing_instrument:
        range: CRMInstrument
        description: CRM-calibrated instrument used to analyze TA samples.
    attributes:
      titration_type:
        title: Titration type
        description: Type of the titration used to determine alkalinity.
        range: string
        required: true
      titration_cell_type:
        title: Cell type
        description: Whether the titration cell is open or closed.
        range: TitrationCellType
      curve_fitting_method:
        title: Curve fitting method
        description: Curve fitting method used to determine the alkalinity.
        range: string

  # =============================================================================
  # DIC Variable Class
  # =============================================================================
  ContinuousDICVariable:
    description: >-
      Dissolved Inorganic Carbon (DIC) measured variable from continuous autonomous sensor.
    is_a: ContinuousMeasuredVariable
    mixins:
      - MeasuredDICFields
    slot_usage:
      variable_type:
        range: string
        equals_string: "dic"
  DiscreteDICVariable:
    description: >-
      Dissolved Inorganic Carbon (DIC) measured variable from discrete bottle samples.
      Uses CRM-calibrated instrument and includes sample preservation information.
      Reference: OAPMetadata XSD variables.xsd - DIC_measured
    is_a: DiscreteMeasuredVariable
    mixins:
      - MeasuredDICFields
    slots:
      - sample_preservation
      - blank_correction
    slot_usage:
      variable_type:
        range: string
        equals_string: "dic"
      analyzing_instrument:
        range: CRMInstrument
        description: CRM-calibrated instrument used to analyze DIC samples.

  # =============================================================================
  # Sediment Variable Class
  # =============================================================================
  ContinuousSedimentVariable:
    description: >-
      Measured sediment variable collected from continuous autonomous sensor
    is_a: ContinuousMeasuredVariable
    mixins:
      - MeasuredSedimentFields
    slot_usage:
      variable_type:
        range: string
        equals_string: "sediment"
  DiscreteSedimentVariable:
    description: >-
      Measured sediment variable collected from discrete bottle samples
    is_a: DiscreteMeasuredVariable
    mixins:
      - MeasuredSedimentFields
    slot_usage:
      variable_type:
        range: string
        equals_string: "sediment"

  # =============================================================================
  # CO2 Variable Classes
  # =============================================================================
  DiscreteCO2Variable:
    description: >-
      CO2 discrete (bottle) measured variable (pCO2/fCO2).
      Reference: OAPMetadata XSD variables.xsd - co2_discrete
    is_a: DiscreteMeasuredVariable
    mixins:
      - MeasuredCO2Fields
    slot_usage:
      variable_type:
        range: string
        equals_string: "co2"
      analyzing_instrument:
        range: CO2GasDetector
        description: CO2 gas detector with standard gas calibration.
    attributes:
      storage_method:
        title: Storage method
        description: How the samples were stored before the measurement.
        range: string
        required: true
      seawater_volume:
        title: Seawater volume (mL)
        description: Volume (in mL) of seawater in the flask.
        range: float
        # TODO: Change to DimensionedQuantity?
      headspace_volume:
        title: Headspace volume (mL)
        description: Volume (in mL) of headspace (water displaced in the flask plus volume of the tubing).
        range: float
        # TODO: Change to DimensionedQuantity?
      measurement_temperature:
        title: Temperature of measurement (°C)
        description: Temperature at which the samples were analyzed in Celsius.
        range: float
        required: true
        # TODO: Change to DimensionedQuantity?

  ContinuousCO2Variable:
    description: >-
      CO2 continuous (sensor) measured variable (xCO2/pCO2/fCO2).
      Reference: OAPMetadata XSD variables.xsd - co2_continuous
    is_a: ContinuousMeasuredVariable
    mixins:
      - MeasuredCO2Fields
    slot_usage:
      variable_type:
        range: string
        equals_string: "co2"
      analyzing_instrument:
        range: ContinuousCO2GasDetector
        description: CO2 gas detector with standard gas calibration for continuous measurements.
    attributes:
      equilibrator:
        title: Equilibrator
        description: Equilibrator used for CO2 measurement.
        range: CO2Equilibrator
      equilibrator_temperature_sensor:
        title: Equilibrator temperature sensor
        description: Temperature sensor for the equilibrator.
        range: TemperatureSensor
      equilibrator_pressure_sensor:
        title: Equilibrator pressure sensor
        description: Pressure sensor for the equilibrator.
        range: PressureSensor
      atmospheric_pressure_sensor:
        title: Atmospheric pressure sensor
        description: Atmospheric pressure sensor.
        range: PressureSensor
      seawater_intake_location:
        title: Location of seawater intake
        description: Whereabouts of the seawater intake.
        range: string
        required: true
      seawater_intake_depth:
        title: Depth of seawater intake
        description: Water depth of the seawater intake.
        range: string
        required: true
      drying_method:
        title: Drying method for CO2 gas
        description: >-
          The method used to dry the gas coming out of CO2 equilibrator,
          before it is pumped into the CO2 sensor.
        range: string
      marine_air_measurement:
        title: CO2 in marine air
        description: Information about CO2 measurements in marine air.
        range: MarineAirMeasurement


  # =============================================================================
  # HPLC Variable Class
  # =============================================================================
  HPLCVariable:
    description: >-
      HPLC (High-Performance Liquid Chromatography) measured variable for
      pigment analysis. Always measured, not calculated.
    is_a: DiscreteMeasuredVariable
    slot_usage:
      variable_type:
        range: string
        equals_string: "hplc"
    attributes:
      hplc_lab:
        title: HPLC Lab
        description: The name of the lab where the HPLC analysis was run (e.g., 'NASA_GSFC'
        range: string
        required: true
      hplc_lab_technician:
        title: HPLC Lab Technician
        description: Name and contact information for HPLC technician.
        range: string

  # =============================================================================
  # Physiological Variable Classes
  # =============================================================================
  DiscretePhysiologicalVariable:
    description: >-
      Physiological response variable from discrete field samples (e.g.,
      organism growth rates, calcification rates, gene expression from
      bottle or tissue samples collected in the field).
    is_a: DiscreteMeasuredVariable
    mixins:
      - MeasuredPhysiologicalFields
    slot_usage:
      variable_type:
        range: string
        equals_string: "physiological"

  ContinuousPhysiologicalVariable:
    description: >-
      Physiological response variable from continuous autonomous field
      sensors (e.g., respiration rates from deployed oxygen consumption
      monitors, heart rate from bio-loggers).
    is_a: ContinuousMeasuredVariable
    mixins:
      - MeasuredPhysiologicalFields
    slot_usage:
      variable_type:
        range: string
        equals_string: "physiological"

  # =============================================================================
  # Socioeconomic Variable Class
  # =============================================================================
  SocioeconomicVariable:
    description: >-
      Socioeconomic variable for social and economic data such as survey
      responses, ecosystem service valuations, or text analysis. A field
      variable: includes method_reference and measurement_researcher, but
      does NOT include QCFields, instrument details, or calibration.
    is_a: InSituVariable
    mixins:
      - FieldMeasurementFields
    slot_usage:
      variable_type:
        range: string
        equals_string: "socioeconomic"
    attributes:
      quantitative_or_qualitative:
        title: Quantitative or Qualitative
        description: >-
          Whether this variable captures quantitative (numerical) or
          qualitative (categorical/textual) data.
        range: QuantitativeQualitative
        required: true
      social_study_type:
        title: Social Study Type
        description: The type of social science study this variable comes from.
        range: SocialStudyType
      social_study_type_custom:
        title: Social Study Type (custom)
        description: Custom study type description when "other" is selected.
        range: string
      social_study_site_characterization:
        title: Study Site Characterization
        description: >-
          Time period and location description for the social study
          (e.g., "2023-2024, coastal communities in Maine, USA").
        range: string

  # =============================================================================
  # Model Variable Class
  # =============================================================================
  ModelVariable:
    description: >-
      A variable output by a model simulation (e.g., air-sea CO2 flux, dissolved
      inorganic carbon, total alkalinity, pH, temperature, salinity from an OAE
      model run). Model outputs are produced by the simulation itself, so they
      carry none of the sampling, instrument, calibration or in-situ QC metadata
      that field-collected variables do — how the output was produced is
      described by the simulation configuration on the parent ModelOutputDataset.
    is_a: Variable
    slot_usage:
      units:
        required: true
      variable_type:
        title: Model Output Variable
        description: >-
          Which model output quantity this variable holds. There is only one
          model variable class, so this classifies the variable rather than
          selecting a schema class.
        range: ModelVariableType

  # =============================================================================
  # Supporting Classes for Variables
  # =============================================================================
  SamplePreservation:
    description: >-
      Sample preservation information for DIC and TA measurements.
      Reference: OAPMetadata XSD variables.xsd - sample_preservation
    attributes:
      preservative:
        title: Preservative used
        description: As described, e.g., Mercury Chloride.
        range: string
        required: true
      volume:
        title: Preservative volume
        description: The volume of preservative used.
        range: string
        required: true
      correction_description:
        title: Preservative correction description
        description: Description of how the preservative effect was corrected for.
        range: string

  VocabularyItemReference:
    slots:
      - description
    attributes:
      term:
        range: string
        required: true
      uri:
        range: uriorcurie
        required: true

  # =============================================================================
  # Mixin Classes
  # =============================================================================


  MeasuredTAFields:
    mixin: true
    description: Fields applied to all measured TA variable types (discrete and continuous)
    slots:
      - appropriate_use_quality
      - concentration_basis

  MeasuredDICFields:
    mixin: true
    description: Fields applied to all measured DIC variable types (discrete and continuous)
    slots:
      - appropriate_use_quality
      - concentration_basis

  MeasuredPHFields:
    mixin: true
    description: Fields applied to all measured pH variable types (discrete and continuous)
    slots:
      - appropriate_use_quality

  MeasuredSedimentFields:
    mixin: true
    description: Fields applied to all measured sediment variable types (discrete and continuous)
    attributes:
      sediment_type:
        title: Sediment Type
        description: e.g., mud, sand, etc.
        range: string
        required: true
      sediment_sampling_method:
        title: Sediment Sampling Method
        description: e.g., sediment core, grab sampling, dredging, etc.
        range: string
        required: true
      sediment_sampling_depth:
        # TODO: add booleean field to designate if sampling depth is provided as a variable, via provided_as_a_file flag?
        title: Sediment Sampling Depth
        description: >-
          Depth that sediment was collected below sediment surface. If provided as a variable (recommended), please list
          the column header name here.
        range: string
        required: true
      sediment_sampling_water_depth:
        # TODO: add booleean field to designate if sampling water depth is provided as a variable, via provided_as_a_file flag?
        title: Sediment Sampling Water Depth
        description: >-
          Water depth where sediment was collected. If provided as a variable (recommended), please list the column
          header name here.
        range: string
        required: true

  MeasuredPhysiologicalFields:
    mixin: true
    description: >-
      Fields applied to all measured physiological variable types (discrete
      and continuous). Captures biological subject identification and
      experimental design information for organism response field studies.
    attributes:
      biological_subject:
        title: Biological Subject
        description: >-
          Taxonomy (species, genus, or community) being studied
          (e.g., Crassostrea gigas, coral reef community).
        range: string
        required: true
      species_identification_code:
        title: Species Identification Code
        description: >-
          Species reference code from a taxonomic database (e.g., WoRMS
          AphiaID 140656, ITIS TSN 79861).
        range: string
      taxonomic_code_system:
        title: Taxonomic Code System
        description: Which taxonomic code system the identification code refers to.
        range: TaxonomicCodeSystem
      life_stage:
        title: Life Stage
        description: Life stage of the organism at time of measurement.
        range: LifeStage
      life_stage_custom:
        title: Life Stage (custom)
        description: Custom life stage description when "other" is selected.
        range: string


  MeasuredCO2Fields:
    mixin: true
    description: Fields applied to all measured CO2 variable types (discrete and continuous)
    slots:
      - appropriate_use_quality
    attributes:
      pco2_reported_temperature:
        title: Temperature at which pCO2 was reported
        description: >-
          In Celsius. The input could be a constant temperature value, or something like, in-situ temperature,
          temperature of analysis, etc.
        # TODO: in the spreadsheet it says co2_reported_temperature should be number, but also says it can be descriptive?
        range: string
        required: true
      water_vapor_correction_method:
        title: Water vapor correction method
        description: How the water vapor pressure inside the equilibrator was determined.
        range: string
      temperature_correction_method:
        title: Temperature correction method
        description: How the temperature effect was corrected.
        range: string

  # Quality Control Fields - All vars except socioeconomic
  QCFields:
    mixin: true
    description: >-
      Quality control fields applicable to measured and calculated variables.
      Not applied to socioeconomic variables.
    slots:
      - qc_steps_taken
      - uncertainty
      - uncertainty_definition
      - missing_value_indicators
    attributes:
      qc_researcher:
        title: Researcher who QCed this variable
        description: The name of the PI whose research team QCed this parameter.
        range: Person
      qc_researcher_institution:
        title: QC Researcher Institution
        description: The institution of the PI whose research team QCed this parameter.
        range: string

  # Method/attribution fields that only apply to in-situ (field-collected)
  # variables. Kept out of InSituVariable itself so ModelVariable (which also
  # extends InSituVariable) does not inherit them — model output is produced by
  # the simulation, not measured by a researcher with a cited method.
  FieldMeasurementFields:
    mixin: true
    description: >-
      Method reference and measuring-researcher attribution for variables
      collected in the field (measured or calculated in situ).
    attributes:
      method_reference:
        title: Method Reference
        description: Citation for the method used.
        range: string
      measurement_researcher:
        title: Researcher who measured the variable
        description: The name of the PI whose research team measured or derived this parameter.
        range: Person


slots:
  # units is common to all variable types, but not required for non-measured variables, so we designate
  # that distinction via required:true slot_usage in Variable class
  units:
    title: Unit
    description: Unit of measurement for this variable.
    range: string
    # TODO: Upgrade this to controlled vocab with QUDT

  # variable_type must be a top-level slot rather than an attribute of Variable:
  # ~15 subclasses pin it via slot_usage, and LinkML's SchemaLoader cannot resolve
  # a slot_usage name back to an attribute, so it would synthesise a phantom
  # `variable_type` slot from the first usage it sees and leak that usage's
  # equals_string into unrelated subclasses.
  variable_type:
    title: Variable Type
    description: >-
      High-level classification of the variable. Determines which standard
      identifiers are available and, combined with genesis and sampling,
      which schema class to use.
    range: VariableType

  # MeasuredVariable slots
  analyzing_instrument:
    title: Analyzing instrument
    description: >-
      Instrument used to analyze the water samples or measure the water body
      continuously. Instrument includes calibration information.
    range: AnalyzingInstrument
    required: true

  # TA & DIC relevant slots
  sample_preservation:
    title: Sample preservation
    description: How the samples were preserved for analysis.
    range: SamplePreservation
    required: true
  blank_correction:
    title: Magnitude of blank correction
    description: Whether the reported variables were corrected for blank, and if so, how they were corrected.
    range: string
    required: true
  concentration_basis:
    title: Per-volume vs per-mass based units
    description: Whether measurements are expressed per unit volume or per unit mass (for DIC, TA, etc.)
    range: ConcentrationBasis
    required: true

  # QC Related slots
  qc_steps_taken:
    title: QC steps taken
    description: >-
      Describe what QC steps have been taken to improve the quality of the data
      (e.g., DOI, software and settings used, outlier removal, etc.).

      If quality control procedures are described in a separate document uploaded with the data, provide the name
      of the document here.
    range: string
  uncertainty:
    title: Uncertainty
    description: >-
      It is recommended to provide uncertainty for each data point in the data file.
      Else provide a single value representative of the dataset.

      If uncertainty is provided as a variable, please list the column header name here.
    range: string
    # TODO: Change to VariableUncertainty in Phase 3
  uncertainty_definition:
    title: How was the uncertainty defined
    description: A description of the uncertainties involved in this method.
    range: string
  missing_value_indicators:
    title: Missing value indicators
    description: >-
      The indicator used to represent missing values in the data file,
      e.g., -999, NaN, etc.
    range: string

  # Weather or Climate Quality Field - Only DIC, pH, pCO2 (both), and TA
  appropriate_use_quality:
    title: Weather or climate quality
    description: >-
      Climate quality is defined as measurements of quality sufficient to assess long term trends with a defined
      level of confidence. Weather quality is defined as measurements of quality sufficient to identify relative
      spatial patterns and short term variation.

      For more details, refer to Newton J.A., Feely R. A., Jewett E. B., Williamson P. & Mathis J., 2015. Global
      Ocean Acidification Observing Network: Requirements and Governance Plan. Second Edition, GOA-ON,
      http://www.goa-on.org/docs/GOA-ON_plan_print.pdf.
    range: AppropriateUseQuality

enums:
  SamplingType:
    permissible_values:
      discrete:
      continuous:
  VariableType:
    description: >-
      High-level classification of the variable. Determines which schema class
      to use in combination with genesis (measured/calculated) and sampling
      (discrete/continuous).
    permissible_values:
      pH:
        description: pH measurement — use with Discrete/ContinuousPHVariable or CalculatedVariable
      ta:
        description: Total alkalinity — use with Discrete/ContinuousTAVariable or CalculatedVariable
      dic:
        description: Dissolved inorganic carbon — use with Discrete/ContinuousDICVariable or CalculatedVariable
      co2:
        description: "CO₂ variables (xCO₂, pCO₂, fCO₂) — use with DiscreteCO2Variable or CalculatedVariable"
      sediment:
        description: Sediment variable — use with Discrete/ContinuousSedimentVariable or CalculatedVariable
      hplc:
        description: HPLC pigment analysis — use with HPLCVariable (always discrete, always measured)
      physiological:
        description: >-
          Physiological response variable — organism response data from
          field experiments. Use with
          Discrete/ContinuousPhysiologicalVariable or CalculatedVariable.
      socioeconomic:
        description: >-
          Socioeconomic variable — social and economic data. Use only
          with SocioeconomicVariable. Does not include QC fields.
      other:
        description: >-
          Any directly measured or calculated variable that does not fall into a
          specific category above (e.g., temperature, salinity, conductivity,
          pressure, fluorescence). Use with DiscreteMeasuredVariable,
          ContinuousMeasuredVariable, or CalculatedVariable.
      non_measured:
        description: >-
          Contextual or ancillary columns that are not directly measured or
          calculated by the project — identifiers, timestamps, coordinates
          and external source data. QC flag columns should NOT
          be listed as separate variables; instead set
          dataset_variable_name_qc_flag on the parent variable. Use only
          with NonMeasuredVariable.
  ModelVariableType:
    description: >-
      Classification of a variable output by a model simulation. Used in place
      of VariableType on ModelVariable — model output covers a different set of
      quantities than field measurement (velocities and fluxes rather than
      sampling-based observations), and there is exactly one model variable
      class, so this enum identifies the variable rather than selecting a class.
    permissible_values:
      air_sea_co2_flux:
        description: "Air-sea CO₂ flux"
      dissolved_inorganic_carbon:
        description: Dissolved inorganic carbon (DIC)
      total_alkalinity:
        description: Total alkalinity (TA)
      temperature:
        description: Temperature
      salinity:
        description: Salinity
      ph:
        description: pH of seawater
      biological_tracers:
        description: >-
          Biological tracers — phytoplankton, chlorophyll, zooplankton, etc.
          biomass or concentration
      zonal_velocity:
        description: Zonal velocity (u)
      meridional_velocity:
        description: Meridional velocity (v)
      vertical_velocity:
        description: Vertical velocity (w)
      co2:
        description: "CO₂ variables (xCO₂, pCO₂, fCO₂)"
      other:
        description: >-
          Any model output variable that does not fall into a specific category
          above.
  GenesisType:
    permissible_values:
      measured:
      calculated:
  ObservationType:
    permissible_values:
      profile:
      surface_underway:
      time_series:
      laboratory_experiments:
      mesocosm:
      field_experiments:
      natural_analogues:
      model_outputs:
  AppropriateUseQuality:
    permissible_values:
      weather_quality:
      climate_quality:
      other:
  TitrationCellType:
    permissible_values:
      open:
      closed:
  ConcentrationBasis:
    description: Whether concentration measurements are expressed per unit volume or per unit mass.
    permissible_values:
      per_volume:
        description: Concentration expressed per unit volume (e.g., μmol/L, mmol/L)
      per_mass:
        description: Concentration expressed per unit mass (e.g., μmol/kg-seawater)

  TaxonomicCodeSystem:
    description: Taxonomic code system used for species identification.
    permissible_values:
      itis:
        description: Integrated Taxonomic Information System
      worms:
        description: World Register of Marine Species
      col:
        description: Catalogue of Life
      pbdb:
        description: Paleobiology Database

  LifeStage:
    description: Life stage of the biological subject.
    permissible_values:
      egg:
      embryo:
      larva:
      juvenile:
      adult:
      other:

  QuantitativeQualitative:
    description: Whether the socioeconomic data is quantitative or qualitative.
    permissible_values:
      quantitative:
      qualitative:

  SocialStudyType:
    description: Type of social study conducted.
    permissible_values:
      public_perception_survey:
        description: Public perception survey
      ecosystem_service_valuation_survey:
        description: Ecosystem service valuation survey
      text_analysis:
        description: Text analysis
      other:
        description: Other study type
