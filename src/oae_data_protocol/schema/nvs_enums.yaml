  PlatformType:
    description: Platform categories from the SeaVoX L06 vocabulary.
    permissible_values:
      aeroplane:
        title: aeroplane
        description: A fixed-wing self-propelled aircraft.
        meaning: NVS_L06:62/
      autonomous_surface_water_vehicle:
        title: autonomous surface water vehicle
        description: A programmed or remotely controlled self-propelled vessel operating on the surface
          of water bodies with no human occupants; includes saildrones.
        meaning: NVS_L06:3B/
      autonomous_underwater_vehicle:
        title: autonomous underwater vehicle
        description: A free-roving platform operating in the water column with propulsion but no human
          operator on board (e.g. Autosub, Gavia).
        meaning: NVS_L06:25/
      beach_intertidal_zone_structure:
        title: beach/intertidal zone structure
        description: A structure to which instrumentation may be attached that is either in air or under
          water depending on the state of the tide and weather conditions.
        meaning: NVS_L06:13/
      coastal_structure:
        title: coastal structure
        description: A fixed man-made structure permanently linked to land with access to water at all
          states of the tide to which instrumentation may be attached (e.g. pier).
        meaning: NVS_L06:17/
      diver:
        title: diver
        description: A human being with self-contained equipment or surface-connected suit enabling operation
          within the water column.
        meaning: NVS_L06:72/
      drifting_subsurface_float:
        title: drifting subsurface float
        description: An unmanned instrumented platform drifting freely in the water column at a depth
          governed by its density (e.g. Swallow float).
        meaning: NVS_L06:44/
      drifting_subsurface_profiling_float:
        title: drifting subsurface profiling float
        description: An unmanned instrumented platform drifting freely in the water column that periodically
          makes vertical traverses through the water column (e.g. Argo float).
        meaning: NVS_L06:46/
      drifting_surface_float:
        title: drifting surface float
        description: An unmanned instrumented platform operating on the surface of the water column often
          attached to a drogue to track currents rather than winds (e.g. Argos buoy).
        meaning: NVS_L06:42/
      fishing_vessel:
        title: fishing vessel
        description: A platform operating on the surface of the water column whose primary purpose is
          the commercial harvesting of fish or shellfish but may be engaged in scientific activities such
          as fish stock surveys or mooring deployments and recoveries.
        meaning: NVS_L06:36/
      fixed_benthic_node:
        title: fixed benthic node
        description: A collection of oceanographic instruments mounted at a fixed position on the seabed
          (e.g. POL Monitoring Platform, seabed ADCP).
        meaning: NVS_L06:11/
      fixed_subsurface_vertical_profiler:
        title: fixed subsurface vertical profiler
        description: A platform that periodically makes an automated vertical traverse of the water column
          at a predetermined fixed location. (e.g. YSI vertical profiler, HOMER CTD).
        meaning: NVS_L06:45/
      float:
        title: float
        description: A free-floating platform either on the surface of the water column or at a predetermined
          depth within the water column.
        meaning: NVS_L06:47/
      glider:
        title: glider
        description: A fixed-wing aircraft with no propulsion.
        meaning: NVS_L06:6A/
      helicopter:
        title: helicopter
        description: An aircraft without wings that obtains its lift from the rotation of overhead blades.
        meaning: NVS_L06:67/
      human:
        title: human
        description: A human being without specialised equipment operating on land or the surface of the
          water column.
        meaning: NVS_L06:71/
      land_or_seafloor:
        title: land or seafloor
        description: A platform located on the solid surface of the Earth either above or below sea level.
        meaning: NVS_L06:10/
      land_onshore_structure:
        title: land/onshore structure
        description: A fixed man-made structure on land to which instrumentation may be attached (e.g.
          meteorological tower).
        meaning: NVS_L06:14/
      land_onshore_vehicle:
        title: land/onshore vehicle
        description: An instrumented vehicle or sample collector that operates on the solid surface of
          the Earth (e.g. mobile meteorological station, land crawler, snowmobile).
        meaning: NVS_L06:15/
      lowered_unmanned_submersible:
        title: lowered unmanned submersible
        description: An unmanned platform lowered and raised vertically by a cable from the mothership.  Includes
          any type of profiling sensor mounting such as CTD frames, profiling radiometers and instrumented
          nets.
        meaning: NVS_L06:26/
      man_powered_boat:
        title: man-powered boat
        description: A platform operating on the surface of the water column that is manually propelled
          and may not be easily removed from the water (e.g. trireme).
        meaning: NVS_L06:38/
      man_powered_small_boat:
        title: man-powered small boat
        description: A platform operating on the surface of the water column that is manually propelled
          and may be easily removed from the water (e.g. rowing boat, canoe).
        meaning: NVS_L06:3A/
      mesocosm_bag:
        title: mesocosm bag
        description: A large polythene bag containing a water sample suspended in the natural environment
          so that it shares ambient physical conditions such as temperature and light levels, but is chemically
          isolated to allow experiments such as fertilisation.
        meaning: NVS_L06:19/
      mesocosm_tank:
        title: mesocosm tank
        description: An indoor or outdoor tank containing water, used to house an experimental system.
          Instruments attached to the tank are used to measure and control conditions to help evaluate
          how organisms or communities react to controlled environmental changes.
        meaning: NVS_L06:99/
      moored_surface_buoy:
        title: moored surface buoy
        description: An unmanned instrumented platform operating on the surface of the water column loosely
          tethered to the seafloor to maintain a fixed position (e.g. ODAS buoy).
        meaning: NVS_L06:41/
      mooring:
        title: mooring
        description: A tethered collection of oceanographic instruments at a fixed location that may include
          seafloor, mid-water and surface components.
        meaning: NVS_L06:48/
      offshore_structure:
        title: offshore structure
        description: A fixed (for the duration of the measurements) man-made structure away from the coast
          to which instrumentation may be attached (e.g. oil rig, gas rig or jack-up barge).
        meaning: NVS_L06:16/
      propelled_unmanned_submersible:
        title: propelled unmanned submersible
        description: A platform operating in the water column attached to a mothership by an umbilical
          with limited propulsion and no human operator on board (e.g. ROV).
        meaning: NVS_L06:22/
      research_aeroplane:
        title: research aeroplane
        description: A fixed-wing self-propelled aircraft that is equipped, manned and operated for atmospheric,
          meteorological or oceanographic research, sometimes also called 'instrumented platform'.
        meaning: NVS_L06:61/
      research_vessel:
        title: research vessel
        description: A platform of any size operating on the surface of the water column in unpredictable
          locations that is specifically equipped, manned and operated for scientific, usually oceanographic,
          research.
        meaning: NVS_L06:31/
      river_station:
        title: river station
        description: An instrumented structure in a river upstream of its tidal limit.
        meaning: NVS_L06:18/
      satellite:
        title: satellite
        description: A vehicle operating beyond the Earth's atmosphere without human occupants that orbits
          the Earth.
        meaning: NVS_L06:68/
      sea_bed_vehicle:
        title: sea bed vehicle
        description: An instrumented platform that is propelled on wheels or tracks on the seabed (e.g
          benthic crawler).
        meaning: NVS_L06:12/
      self_propelled_boat:
        title: self-propelled boat
        description: A small self-propelled platform operating on the surface of the water column in unpredictable
          locations that is smaller than a ship, but too large to easily remove from the water.
        meaning: NVS_L06:37/
      self_propelled_small_boat:
        title: self-propelled small boat
        description: A small self-propelled platform operating on the surface of the water column that
          may be easily removed from the water (e.g. shore-based RIBs, ships' boats).
        meaning: NVS_L06:33/
      ship:
        title: ship
        description: 'A large platform operating on the surface of the water column. Objective definitions
          for guidelines: >50m length (EU), >100 foot length (USA), >300 GRT weight (SOLAS). Subjective
          definition: a ship is a vessel big enough to carry a boat.'
        meaning: NVS_L06:30/
      sub_surface_gliders:
        title: sub-surface gliders
        description: Platforms with buoyancy-based propulsion that are capable of operations at variable
          depths which are not constrained to be near the sea surface.
        meaning: NVS_L06:27/
      submersible:
        title: submersible
        description: A platform operating within a water body.
        meaning: NVS_L06:20/
      subsurface_mooring:
        title: subsurface mooring
        description: A collection of oceanographic instruments attached to wires suspended between anchors
          on the seabed and buoyant spheres in the water column.
        meaning: NVS_L06:43/
      surface_gliders:
        title: surface gliders
        description: Platforms operating at a single depth near the sea surface, using a combination of
          solar energy and wave motion as means of propulsion.
        meaning: NVS_L06:3C/
      surface_vessel:
        title: surface vessel
        description: A mobile platform with propulsion operating on and restricted to the surface of a
          water body.
        meaning: NVS_L06:3Z/
      towed_unmanned_submersible:
        title: towed unmanned submersible
        description: A vehicle towed by rigid cable through the water column at fixed or varying depth
          with no propulsion and no human operator (e.g. Towfish, Scanfish, UOR, SeaSoar).
        meaning: NVS_L06:23/
      unmanned_aerial_vehicle:
        title: unmanned aerial vehicle
        description: 'Any untethered heavier-than-air aircraft that is not occupied by people: may be
          a remotely piloted aircraft or an autonomous aircraft. Also referred to as a drone.'
        meaning: NVS_L06:6D/
      vessel_at_fixed_position:
        title: vessel at fixed position
        description: A platform of any size occupying a fixed location on the surface of the water column
          for prolonged periods collecting scientific (oceanographic and meteorological) data as a primary
          or secondary mission.  Includes light vessels and weather ships.
        meaning: NVS_L06:34/
