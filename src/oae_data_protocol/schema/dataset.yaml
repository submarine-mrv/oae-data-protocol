id: Dataset
name: Dataset

prefixes:
  oae: "https://schema.oaedata.org/"

default_prefix: oae

classes:
  Dataset:
    # TODO: We may want to revert to set 'abstract: true' again once we set `include_range_class_descendents: true`
    # As of right now, setting Dataset to abstract means we don't get it in the JSON Schema at all and it breaks
    # downstream usage
    # abstract: true
    description: >-
      Abstract base class for all dataset types. Contains fields common to both field/observational and model simulation
      datasets. Generally following guidelines & best practices as outlined in
      [science-on-schema.org](https://github.com/ESIPFed/science-on-schema.org/blob/main/guides/Dataset.md)
    slots:
      - name
      - description
      - project_id
      - experiment_id
    slot_usage:
      - name:
          title: Dataset Title
          range: string
          required: true
          description: >-
            A brief descriptive sentence that summarizes the content of a dataset. Here is one example:

            "Dissolved inorganic carbon, total alkalinity, pH, temperature, salinity and other variables collected from
            profile and discrete sample observations using CTD, Niskin bottle, and other instruments from R/V Wecoma in
            the U.S. West Coast California Current System during the 2011 West Coast Ocean Acidification Cruise
            (WCOA2011) from 2011-08-12 to 2011-08-30"
      - description:
          range: string
          required: true
          description: >-
            The abstract of a dataset is a brief summary that provides an overview of the dataset's content, purpose,
            and scope. It is used to provide context and background information to users who are interested in using the
            dataset. An abstract may include information such as the dataset's source, how the data was collected or
            generated, the variables or attributes included in the dataset, and any limitations or restrictions on the
            use of the data. It may also include information on how the data can be accessed or used.
      - project_id:
          # TODO: Consider making the "required: true" general for all implementations of project_id
          required: true
      - experiment_id:
          # TODO: Consider making the "required: true" general for all implementations of experiment_id
          required: true
    attributes:
      dataset_type:
        # TODO: Add pre/post condition slots for _custom field rendering
        title: Dataset Type
        description: >-
          Selected controlled vocabularies for data types relevant to mCDR have been referenced from NASA's SeaBASS
          metadata system and are provided below, for additional data types of optical characteristics see the [SeaBASS
          controlled definitions list](https://seabass.gsfc.nasa.gov/wiki/metadataheaders#data_type). Additional data
          types have been included to meet the needs of mCDR field projects.
        range: DatasetType
        required: true
      dataset_type_custom:
        title: Dataset Type (Custom)
        description: >-
          Custom "data type" when an appropriate value is not found in the controlled vocabulary list for mCDR Data Type
          and the corresponding `data_type` field is set to "other".
        range: string
      data_submitter:
        title: Data Submitter
        range: Person
        required: true
      author_list_for_citation:
        title: Author List (for citation)
        range: string
        description: >-
          Author list in the format of Lastname1, Firstname1 Middlename1; Lastname2, Firstname2 Middlename2; ...
      license:
        title: License
        slot_uri: schema:license
        description: >-
          Link a Dataset to its license to document legal constraints by adding a schema:license property. The guide
          recommends providing a URL that unambiguously identifies a specific version of the license used, but for many
          licenses it is hard to determine what that URL should be. Thus, we recommend that the license URL be drawn
          from the [SPDX license list](https://spdx.org/licenses/), which provides a curated list of licenses and their properties that is well
          maintained. For each SPDX entry, SPDX provides a canonical URL for the license (e.g.,
          http://spdx.org/licenses/CC0-1.0), a unique licenseId (e.g., CC0-1.0), and other metadata about the license.
        range: uri
      fair_use_data_request:
        title: Fair Use Data Request
        description: A statement from the data producer regarding how this dataset should be used.
        range: string
      filenames:
        # TODO: Should be upgraded to be compatilbe with schema:distribution
        # https://github.com/ESIPFed/science-on-schema.org/blob/main/guides/Dataset.md#distributions
        title: Filenames
        range: string
        required: true
        multivalued: true
        # TODO: workaround since JSON Schema treats [] values as satisfying the "required" constraint
        # It might be nice to fix this in a linkml PR to have minItems=1 automatically set for required lists in the
        # JSONSchema generator
        minimum_cardinality: 1

    exact_mappings:
      - "schema:Dataset"
      - "dcat:Dataset"

  FieldDataset:
    is_a: Dataset
    description: >-
      A field or observational dataset related to an OAE experiment. Contains fields specific to in-situ data
      collection such as platform information, calibration files, QC flags, and measured variables.
    slots:
      - temporal_coverage
    attributes:
      data_product_type:
        title: Data Product Type
        description: >-
          "Controlled vocabulary" One of the three choices: (a) Originally collected dataset (e.g., a dataset collected
          from a research cruise or laboratory experiment), (b) Data compilation product (e.g., SOCAT, GLODAP), or
          (c) Derived product (e.g., gridded products, or model output).
        range: DataProductType
        required: true
      qc_flag_scheme:
        title: QC Flag Scheme
        description: >-
          Describe what the quality control flags stand for, e.g.,
            0 = interpolated or calculated data
            1 = not evaluated/quality unknown
            2 = acceptable
            3 = questionable
            4 = known bad
            6 = median of replicates
            9 = missing value"
        range: string
      platform_info:
        title: Platform Information
        range: Platform
        required: true
      calibration_files:
        title: Calibration Files
        description: >-
          A list of supplementary file names containing coefficients and techniques used to
          calibrate the instruments used in data collection. The named files can be found within the relevant documents
          folder accompanying the submitted data files.
        range: string
        multivalued: true
      variables:
        title: Variables
        slot_uri: schema:variableMeasured
        range: Variable
        multivalued: true

  ModelOutputDataset:
    is_a: Dataset
    description: >-
      A model simulation output dataset. Contains fields specific to computational model output including
      simulation configuration, output variables, and hardware information.
    slot_usage:
      filenames:
        title: Model Output Filenames
    attributes:
      simulation_type:
        title: Simulation Type
        description: "Whether this is a counterfactual (control/baseline) or perturbation simulation."
        range: SimulationType
        required: true
      spin_up_protocol:
        title: Spin-up Protocol
        description: "Description of the model spin-up process."
        range: string
      start_datetime:
        title: Start Date and Time
        description: "Start date and time of the simulation in UTC ISO-8601."
        range: datetime
        required: true
      end_datetime:
        title: End Date and Time
        description: "End date and time of the simulation in UTC ISO-8601."
        range: datetime
        required: true
      output_frequency:
        title: Output Frequency
        description: "Frequency of model output (e.g., 'hourly mean', 'daily mean')."
        range: string
      time_stepping_scheme:
        title: Time-stepping Scheme
        description: "Time-stepping method and time step used in the simulation."
        range: string
      mcdr_forcing_description:
        title: Description of mCDR Forcing
        description: >-
          Description of the mCDR forcing applied in the simulation (e.g., the alkalinity perturbation).
          Required when simulation_type is "perturbation".
        range: string
      hardware_configuration:
        title: Hardware Configuration
        description: "Details about the computational hardware used for the simulation."
        range: HardwareConfiguration
        inlined: true
      model_output_variables:
        title: Key Model Output Variables
        description: "Checklist of variables included in the model simulation output."
        range: ModelOutputVariable
        multivalued: true
    rules:
      - preconditions:
          slot_conditions:
            simulation_type:
              equals_string: "perturbation"
        postconditions:
          slot_conditions:
            mcdr_forcing_description:
              required: true

  HardwareConfiguration:
    description: "Details about the computational hardware used to run a model simulation."
    attributes:
      machine:
        title: Machine
        description: "Name of the machine or cluster (e.g., 'Perlmutter')."
        range: string
      operating_system:
        title: Operating System
        description: "Operating system used (e.g., 'Linux')."
        range: string
      cpu_gpu_details:
        title: CPU/GPU Details
        description: "Details about CPU/GPU hardware or link to specifications."
        range: string
      memory:
        title: Memory
        description: "Memory available (e.g., '512 GB DDR4')."
        range: string
      storage:
        title: Storage
        description: "Storage available (e.g., '44 PB')."
        range: string
      parallelization:
        title: Parallelization
        description: "Parallelization details (e.g., '3 nodes, 108 ntasks per node')."
        range: string
