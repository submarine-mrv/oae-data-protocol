id: Core
name: Core

prefixes:
  schema: "http://schema.org/"
  oae: "https://schema.oaedata.org/"

default_prefix: oae

slots:
  description:
    title: Description
    slot_uri: schema:description
    description: "A narrative description of the thing."
    range: string
  name:
    title: Name
    slot_uri: schema:name
    description: "A human-readable name for the thing."
    range: string
  identifier:
    slot_uri: schema:identifier
    description: "A unique identifier for the thing"
    range: string
  experiment_id:
    title: Experiment ID
    description: >-
      The experiment to which the data belong. Any naming convention that produces a unique ID is usable.
      The recommended naming convention is:
      
      Project ID + Experiment type + Optional numerical indicator to differentiate between various experiments of
      the same type for a project. A two digit consecutive number beginning with 01
    range: string
  project_id:
    title: Project ID
    description: >-
      The project to which the submitted data belong. A unique project identifier that can be used to link project
      data across data submissions, and link baseline data to intervention data, for example.
      
      If no Project ID has been assigned, one may be generated by combining: lead organizer surname and first
      initial or company, a unique date, and location.
      
      Any method that creates a unique ID that will link all project data is acceptable.
    range: string
  temporal_coverage:
    title: Temporal Coverage
    slot_uri: schema:temporalCoverage
    description: >-
      Start date and end date (if known) of the project in ISO-8601 interval format (YYYY-MM-DD/YYY-MM-DD). If the end date is not known, use open-ended format YYYY-MM-DD/..
    range: string
    pattern: "^\\d{4}-\\d{2}-\\d{2}/(\\d{4}-\\d{2}-\\d{2}|\\.\\.)$"
    required: true
  spatial_coverage:
    title: Spatial Coverage
    slot_uri: schema:spatialCoverage
    description: >-
      Latitude/longitude bounds of project site (e.g., boundary domain of observations or relevant
      activities), expressed as a schema.org GeoShape `box`. Per the science-on-schema.org Dataset
      guide, the box string is two space-separated corner points — the southwest (lower-left) corner
      followed by the northeast (upper-right) corner — with each point written as
      `<latitude> <longitude>` in decimal degrees (WGS 84). Full format:
      `"<minLat> <minLon> <maxLat> <maxLon>"`. Example: `"39.3280 120.1633 40.445 123.7878"`.
      See https://github.com/ESIPFed/science-on-schema.org/blob/main/guides/Dataset.md#spatialcoverage
    # Could update this to be a more restrictive range (e.g. SpatialCoverage, which inherits from Place and only
    # allows GeoShapes, not GeoCoordinates)
    range: SpatialCoverage
    required: true
  vertical_coverage:
    title: Vertical Coverage
    description: >-
      Minimum and maximum depths of observation in meters.
    range: VerticalExtent
  permits:
    title: Permits
    description: Associated permit number(s).
    range: Permit
    multivalued: true
    inlined_as_list: true
  geo:
    description: "Entities that have a somewhat fixed, physical extension. (imported from schema.org)"
    range: Any
    any_of:
      - range: GeoShape
      - range: GeoCoordinates

classes:
  PropertyValue:
    class_uri: schema:PropertyValue
  Any:
    class_uri: linkml:Any
  Place:
    description: >-
      A geospatial area of interest, defined by a bounding box, polygon/line, or a point designated as a 
      pair of geo-coordinates.
    slots:
      - geo
    class_uri: "schema:Place"
  SpatialCoverage:
    is_a: Place
    description: "A bounding box defined by latitude and longitude coordinates."
    slot_usage:
      geo:
        required: true
        range: GeoShape
  DosingLocation:
    is_a: Place
    description: >-
      A specific location of dosing for an OAE intervention and/or tracer study. Can be a point, line, or bounding box
    attributes:
      dosing_location_file:
        # TODO: Add rules so that dosing_location_file is required IFF dosing_location is a bounding box
        description: >-
          Exact path and filename for the location file (relative to root path of project), attached separately.
          Format should be one of GeoJSON or Shapefile.
        range: string

  GeoShape:
    description: >-
      The geographic shape of a place. A GeoShape can be described using several properties whose values are based on
      latitude/longitude pairs. Either whitespace or commas can be used to separate latitude and longitude; whitespace
      should be used when writing a list of several such points. (imported from schema.org)
    attributes:
      box:
        description: >-
          A bounding box defined by two corner points — the southwest (lower-left) corner followed
          by the northeast (upper-right) corner. Per science-on-schema.org, each point is written
          as `<latitude> <longitude>` in decimal degrees (WGS 84), with all four values
          space-separated: `"<minLat> <minLon> <maxLat> <maxLon>"`. Example:
          `"39.3280 120.1633 40.445 123.7878"`. See
          https://github.com/ESIPFed/science-on-schema.org/blob/main/guides/Dataset.md#spatialcoverage
        range: string
        slot_uri: schema:box
      line:
        description: >-
          A line is a point-to-point path consisting of two or more points. A line is expressed as a series of two or
          more point objects separated by space.
        range: string
        slot_uri: schema:line
    class_uri: "schema:GeoShape"
  GeoCoordinates:
    class_uri: "schema:GeoCoordinates"
    description: "A geographic coordinate in decimal degrees."
    attributes:
      latitude:
        title: Latitude
        slot_uri: schema:latitude
        description: "Latitude in decimal degrees of a location. For example 37.42242 (WGS 84)."
        range: float
        required: true
      longitude:
        title: Longitude
        slot_uri: schema:longitude
        description: "Longitude in decimal degrees of a location. For example -122.08585 (WGS 84)."
        range: float
        required: true
  VerticalExtent:
    description: "The vertical extent of a place or structure in meters."
    attributes:
      min_depth_in_m:
        title: Minimum Depth (in meters)
        description: "Minimum depth of observation in meters. Use negative numbers for depths below sea level."
        range: float
        maximum_value: 0
      max_depth_in_m:
        title: Maximum Depth (in meters)
        description: "Maximum depth of observation in meters. Use negative numbers for depths below sea level."
        range: float
        maximum_value: 0
      min_height_in_m:
        title: Minimum Height (in meters)
        description: "Minimum height of observation (in meters) for above ground aerial coverage."
        range: float
        minimum_value: 0
      max_height_in_m:
        title: Maximum Height (in meters)
        description: "Maximum height of observation (in meters) for above ground aerial coverage."
        range: float
        minimum_value: 0
  Organization:
    class_uri: schema:Organization
    slots:
      - identifier
      - name
    slot_usage:
      identifier:
        description: >-
          Organization identifier in the form of an ROR URL (e.g., https://ror.org/02mhbdp94). Please visit
          [https://ror.org](https://ror.org) to search for the organization and find the appropriate ROR URL.
      name:
        description: "Name of the organization"
        required: true
    attributes:
      country:
        title: Country
        description: "The country in which the organization belongs."
        range: string

types:
  Doi:
    title: DOI
    uri: xsd:string
    base: str
    description: "A Digital Object Identifier (DOI) for a digital object such as a document, dataset, or software package."
