id: Experiment
name: Experiment

prefixes:
  oae: "https://example.org/oae#"
  schema: "http://schema.org/"

default_prefix: oae

classes:
  Experiment:
    # TODO: We may want to revert to set 'abstract: true' again once we set `include_range_class_descendents: true`
    # As of right now, setting Experiment to abstract means we don't get it in the JSON Schema at all and it breaks
    # downstream usage
    # abstract: true
    description: >-
      Abstract base class for all experiment types. Contains fields common to both in-situ and model experiments.
    slots:
      - name
      - description
      - spatial_coverage
      - project_id
      - experiment_id
    slot_usage:
      project_id:
        required: true
      experiment_id:
        required: true
      description:
        title: Experiment Description
        description: >-
          A narrative description of the experiment. For example, what part of the project do these data represent
          (e.g., baseline, intervention, control) and what do they contribute to the overall project? Are all project
          research questions listed in Project description relevant? What were the processes to achieve these goals and
          answer these questions? Data submitters are encouraged to note any significant changes to the original
          experimental plan due to unforeseen circumstances here.
        required: true
      name:
        description: Optional common name for experiment.
      spatial_coverage:
        description: >-
          Latitude/longitude bounds of observed data in experiment, provided in decimal degrees as westernmost
          longitude, southernmost latitude, easternmost longitude, northernmost latitude. [S, W, N, E]
        required: true
    attributes:
      experiment_type:
        title: mCDR Experiment Type
        description: "The type of mCDR experiment conducted. See Controlled Vocabularies section for definitions."
        range: ExperimentType
        multivalued: true
        required: true
      public_comments:
        title: Public Comments
        description: "If possible, please provide public comments concatenated into a single pdf"
        range: string
        recommended: true
      experiment_leads:
        title: Experiment Lead(s)
        description: >-
          Provide details for each experiment lead / principal investigator (PI) including: Name, institutional information (name, address),
          phone, email, ID type (e.g., ORCID, etc), researcher ID, and role.
        range: Person
        multivalued: true
        inlined_as_list: true
        required: true
      start_datetime:
        title: Start Date and Time (UTC)
        description: "Start date and time of experiment in UTC ISO-8601"
        range: datetime
        required: true
      end_datetime:
        title: End Date and Time (UTC)
        description: "End date and time of experiment in UTC ISO-8601"
        range: datetime
  InSituExperiment:
    is_a: Experiment
    description: >-
      Experiment metadata for in-situ studies (interventions, tracer studies, etc.). Contains fields specific to
      field-based experiments that don't apply to model experiments.
    slots:
      - vertical_coverage
      - permits
    slot_usage:
      vertical_coverage:
        description: Minimum and maximum depths of observations in meters.
    attributes:
      data_conflicts_and_unreported_data:
        title: Data Conflicts and Unreported Data
        description: >-
          If data exist that are or have been used by the project but are not provided due to conflicts (e.g.,
          geopolitical or other), data availability (e.g., a dataset is no longer available), it may be noted here.
        range: string
      meteorological_and_tidal_data:
        title: Meteorological and Tidal Data
        description: >-
          Include links to relevant open datasets if referenced in the experiment but not provided in the submission.
        range: NamedLink
        multivalued: true
        inlined_as_list: true
      additional_details:
        title: Additional Details
        description: >-
          Open text area to include additional information. These may include information for sediment processes data,
          biological data, or any other required information if not included in the main metadata or data files; see
          General Guidelines for Your Data for relevant sections of your data. Additional informational files, such
          as digitized laboratory notebooks, blogs, etc., may be linked here.
        range: string
  Intervention:
    is_a: InSituExperiment
    mixins:
      - InterventionDetails
      - DosingDetails
    description: >-
      Additional metadata that applies to experiments where an intervention, such as an alkalinity addition, was
      conducted.
    rules:
      - preconditions:
          slot_conditions:
            alkalinity_feedstock:
              equals_string: "other"
        postconditions:
          slot_conditions:
            alkalinity_feedstock_custom:
              required: true
      - preconditions:
          slot_conditions:
            alkalinity_feedstock_processing:
              equals_string: "other"
        postconditions:
          slot_conditions:
            alkalinity_feedstock_processing_custom:
              required: true


  Tracer:
    is_a: InSituExperiment
    description: "Additional metadata that applies to experiments where a tracer study was conducted"
    mixins:
      - TracerDetails
      - DosingDetails
    rules:
      - preconditions:
          slot_conditions:
            tracer_form:
              equals_string: "other"
        postconditions:
          slot_conditions:
            tracer_form_custom:
              required: true

  InterventionWithTracer:
    is_a: Intervention
    mixins:
      - TracerDetails
    description: >-
      Additional metadata that applies to hybrid experiments where an intervention was conducted simultaneously
      alongside a tracer study, using the same instrumentation.
    rules:
      - preconditions:
          slot_conditions:
            tracer_form:
              equals_string: "other"
        postconditions:
          slot_conditions:
            tracer_form_custom:
              required: true

  InterventionDetails:
    description: >- 
      An abstract class (used as a mixin, not implemented directly) for detailing the required fields that are 
      specific to an Experiment with type "Intervention"
    mixin: true
    attributes:
      alkalinity_feedstock_processing:
        title: Alkalinity Feedstock Processing
        description: >-
          Method(s) used to process the alkalinity feedstock. See Controlled Vocabularies section for definitions.
        range: AlkalinityFeedstockProcessing
        required: true
      alkalinity_feedstock_processing_custom:
        title: Alkalinity Feedstock Processing (Custom)
        description: >-
          Custom description of alkalinity feedstock processing method when 'other' is selected in
          alkalinity_feedstock_processing.
        range: string
      alkalinity_feedstock_form:
        title: Alkalinity Feedstock Form
        description: "The phase upon delivery to the ocean. See Controlled Vocabularies section for definitions."
        range: AlkalinityFeedstockForm
        required: true
      alkalinity_feedstock:
        title: Alkalinity Feedstock
        description: >-
          Examples may include: olivine, potassium hydroxide, magnesium hydroxide, lime, portlandite, calcium carbonate,
          anorthite, dolomite, periclase, brucite, magnesite, forsterite, sodium hydroxide, natrite, nahcolite,
          akermanite, akermanite, alunoakermanite, etc.

          See Controlled Vocabularies section for selected examples (this list is not exhaustive, you may need to
          include your unique feedstock).
        range: FeedstockType
        required: true
      alkalinity_feedstock_custom:
        title: Alkalinity Feedstock (Custom)
        description: >-
          Custom description of alkalinity feedstock when using a feedstock type not listed in the controlled
          vocabulary.
        range: string
      alkalinity_feedstock_co2_removal_potential:
        title: Alkalinity Feedstock CO₂ Removal Potential
        description: >-
          Maximum CO₂ removal potential of a feedstock material. We recommend using an adjusted version of the Steinour
          equation (Gunning et al., 2010), which uses bulk elemental oxide composition to estimate the maximum CO₂
          removal potential of a feedstock material. The calculation output is in the form of kg of CO₂ per tonne of
          feedstock and represents the quantitative hypothetical potential of the material to capture CO₂ as bicarbonate
          or carbonate. See Isometric's CO2 removal potential module for details.
        range: float
        required: true
      alkalinity_feedstock_description:
        title: Alkalinity Feedstock Description
        description: >-
          Information such as feedstock source, characteristics, impurities, dilution prior to dosing, and
          concentration. For feedstock other than NaOH: trace metal composition and particulate grain size. Any variable
          information must be provided in the dosing data file, in this case include the data file and column header
          names here provided as variables. See Intervention Data for details.
        range: string
        required: true
      equilibration:
        title: Equilibration
        description: "Whether the feedstock was pre-equilibrated or unequilibrated"
        range: EquilibrationStatus
        required: true
      alkalinity_dosing_effluent_density:
        title: Alkalinity Dosing Effluent Density
        description: >-
          Fixed density or provide link/source to effluent density data if applicable. Please include whether density is
          directly measured or a derived value. If this is a variable included with your data, please note so here as
          'alkalinity dosing effluent density is provided as a variable' and use 'dosing_effluent_density' for your
          column header name.
        range: DosingConcentration
        required: true
  TracerDetails:
    description: >-
      An abstract class (used as a mixin, not implemented directly) for detailing the required fields that are 
      specific to an Experiment with type "Tracer"
    mixin: true
    attributes:
      tracer_form:
        title: Tracer Form
        description: "The form of tracer upon delivery to the ocean (e.g. gas or dye-release)"
        range: TracerForm
        required: true
      tracer_form_custom:
        title: Tracer Form (Custom)
        description: >-
          If "other" was selected for Tracer Form, please specify the custom tracer form here.
        range: string
      tracer_details:
        title: Tracer Details
        description: "state the kind of tracer used (e.g. rhodamine, or a specific gas)"
        range: string
        required: true
      tracer_concentration:
        title: Tracer Concentration
        # todo: update to number & unit. along with effluent density
        description: >-
          Fixed concentration or provide link/source to tracer concentration separately in the dosing file. Please
          include whether concentration is directly measured or a derived value. If this is a variable included with 
          your data, please note so here as 'tracer concentration provided as a variable' and use
          'tracer_concentration' for your column header name.
        range: DosingConcentration
        required: true
  DosingConcentration:
    # TODO: Add a `rules` block to require `amount` and `unit` to be empty if `provided_as_a_file` is true
    description: Details of tracer concentration information
    attributes:
      amount:
        range: float
      # TODO: update unit to be semantic type (units-of-measure, or qudt)
      unit:
        range: MassConcentrationUnit
    slots:
      - is_derived_value
      - is_provided_as_a_file
    slot_usage:
      is_provided_as_a_file:
        description: "Select ‘Variable’ if the concentration varies over time, or ‘Fixed Value’ if it is constant. Note: Variable concentrations must be provided in a data file."

  DosingDetails:
    mixin: true
    description: >-
      An abstract class (used as a mixin, not implemented directly) for detailing the required fields that are 
      specific to an Experiment with active dosing (e.g. type "Tracer", "Intervention", or "InterventionWithDosing")
    attributes:
      dosing_delivery_type:
        title: Dosing Delivery Type
        description: "Type of dosing delivery method. See Controlled Vocabularies for definitions."
        range: DosingDeliveryType
        required: true
      dosing_location:
        title: Dosing Location
        description: >-
          Provide latitude and longitude in decimal degrees. Depending on your method of dispersal, this information may
          be provided as a point source, vector, or bounding box. If provided as a vector, the latitude and longitude
          values should be included in the dosing data file.
        range: DosingLocation
        required: true
      dosing_dispersal_hydrologic_location:
        title: Dosing Dispersal Hydrologic Location
        description: "Descriptive dosing location"
        range: HydrologicLocation
        required: true
      dosing_depth:
        title: Dosing Depth
        description: >-
          Depth in meters. If this is variable, please include the schedule of depth changes and depths, or as a vector
          in meters with the data.
        range: string
        required: true
      dosing_regimen:
        title: Dosing Regimen
        # TODO: Would be nice to add an example to this description (e.g. hourly, continuous rampup over 24-hour period...)
        description: >-
          A human readable summary description of the dosing regimen / frequency. Exact details must be provided
          in the corresponding dosing file with exact timestamps for dosing on/off schedule.
        range: string
        required: true
      dosing_description:
        title: Dosing Description
        description: >-
          Please be descriptive. Information about the dosing mechanism must be included (outflow from pipe,
          diffuser, doser, manual placement)
          
          E.g., outflow from existing facility pipe directly to ocean, manual riverine introduction, coastal
          distribution at three separate 30 meter long sections, pier-based diffuser to intercoastal bay, distributed
          from stationary barge 10 miles offshore.
        range: string
        required: true

slots:
  is_provided_as_a_file:
    description: >-
      Indicates that the field in question is provided as a file. The value used here is intended to be a summary range
      or general area of coverage.
    range: boolean
    required: true
  is_derived_value:
    description: Indicates that the field in question is a derived value as opposed to one measured directly.
    range: boolean
    required: true