---
site_name: "OAE Data Protocol: Schema Documentation"
theme:
  # https://www.mkdocs.org/user-guide/configuration/#theme
  name: material
  favicon: img/favicon.ico
  logo: img/cts-logo.png
  # Light theme only. Dark mode intentionally omitted — no palette/toggle
  # configured. Custom brand colors live in stylesheets/extra.css.
  features:
    - navigation.indexes
    - content.tabs.link
    - header.autohide      # maximum screen space during scrolling
    - navigation.expand    # optimize user experience
    - navigation.instant   # optimize user experience
    - navigation.instant.progress
    - navigation.tracking  # update address bar
    - search.suggest       # suggest good completions
    - content.code.copy    # enable copy to clipboard

# extra css/js see https://www.mkdocs.org/user-guide/customizing-your-theme/
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js

plugins:
  - search
  - mermaid2:
      version: 11.4.1

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - attr_list
  - pymdownx.superfences:
      # https://mkdocs-mermaid2.readthedocs.io/en/latest/superfences
      # custom code highlighting rules
      custom_fences:
        - name: mermaid
          # disable code highlighting to display diagrams
          format: !!python/name:pymdownx.superfences.fence_code_format
          class: mermaid

  # TODO rebuild docs on schema change (https://github.com/dalito/linkml-project-copier/issues/39)
  # - gen-files:
  #     scripts:
  #       - gen_pages.py  # or any other name or path

watch:
  - src/oae_data_protocol/schema

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Metadata File Format: metadata-format.md
    - Metadata Builder: metadata-builder.md
    - Contributing: contributing.md
  - Projects & Experiments:
    - projects-experiments/index.md
    - Project: Project.md
    - Experiment: Experiment.md
    - InSituExperiment: InSituExperiment.md
    - Intervention: Intervention.md
    - Tracer: Tracer.md
    - InterventionWithTracer: InterventionWithTracer.md
    - Model: Model.md
  - Datasets:
    - Datasets/index.md
    - FieldDataset: FieldDataset.md
    - ModelOutputDataset: ModelOutputDataset.md
  - Variables:
    # Only the abstract/intermediate classes are listed here. Concrete leaf
    # variable types (DiscretePHVariable, HPLCVariable, physiological, etc.)
    # are reachable from their parent pages, which enumerate their subclasses.
    - Variables/index.md
    - Variable: Variable.md
    - InSituVariable: InSituVariable.md
    - MeasuredVariable: MeasuredVariable.md
    - DiscreteMeasuredVariable: DiscreteMeasuredVariable.md
    - ContinuousMeasuredVariable: ContinuousMeasuredVariable.md
    - CalculatedVariable: CalculatedVariable.md
    - NonMeasuredVariable: NonMeasuredVariable.md
  - Instruments & Calibration:
    - instruments-calibration/index.md
    - AnalyzingInstrument: AnalyzingInstrument.md
    - PHInstrument: PHInstrument.md
    - CRMInstrument: CRMInstrument.md
    - CO2GasDetector: CO2GasDetector.md
    - Calibration: Calibration.md
  - Controlled Vocabularies: vocabularies.md
  - Full Schema Index: OAEDataSchema.md

exclude_docs: |
  /templates-linkml/

site_url: https://schema.oaedata.org
repo_url: https://github.com/submarine-mrv/oae-data-protocol

# Uncomment this block to enable use of Google Analytics.
# Replace the property value with your own ID.
# extra:
#   analytics:
#     provider: google
#     property: G-XXXXXXXXXX
