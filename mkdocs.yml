---
site_name: "oae-data-protocol"
theme:
  # https://www.mkdocs.org/user-guide/configuration/#theme
  name: material
  icon:
    logo: material/book-open-page-variant
  # palette:
  #  scheme: slate
  #  primary: cyan
  features:
    - content.tabs.link
    - header.autohide      # maximum screen space during scrolling
    - navigation.expand    # optimize user experience
    - navigation.instant   # optimize user experience
    - navigation.instant.progress
    - navigation.tracking  # update address bar
    - search.suggest       # suggest good completions
    - content.code.copy    # enable copy to clipboard

# extra css/js see https://www.mkdocs.org/user-guide/customizing-your-theme/
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js

plugins:
  - search
  - mknotebooks:
      execute: false
  - mermaid2:
      version: 11.4.1
  - mkdocs_pymdownx_material_extras:
    # https://pypi.org/project/mkdocs-pymdownx-material-extras

markdown_extensions:
  - pymdownx.superfences:
      # https://mkdocs-mermaid2.readthedocs.io/en/latest/superfences
      # custom code highlighting rules
      custom_fences:
        - name: mermaid
          # disable code highlighting to display diagrams
          format: !!python/name:pymdownx.superfences.fence_code_format
          class: mermaid

  # TODO rebuild docs on schema change (https://github.com/dalito/linkml-project-copier/issues/39)
  # - gen-files:
  #     scripts:
  #       - gen_pages.py  # or any other name or path

watch:
  - src/oae_data_protocol/schema

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Metadata File Format: metadata-format.md
    - Metadata Builder: metadata-builder.md
    - Contributing: contributing.md
  - Projects & Experiments:
    - projects-experiments/index.md
    - Project: elements/Project.md
    - Experiment: elements/Experiment.md
    - InSituExperiment: elements/InSituExperiment.md
    - Intervention: elements/Intervention.md
    - Tracer: elements/Tracer.md
    - InterventionWithTracer: elements/InterventionWithTracer.md
    - Model: elements/Model.md
  - Datasets:
    - Datasets/index.md
    - FieldDataset: elements/FieldDataset.md
    - ModelOutputDataset: elements/ModelOutputDataset.md
  - Variables:
    - Variables/index.md
    - InSituVariable: elements/InSituVariable.md
    - MeasuredVariable: elements/MeasuredVariable.md
    - CalculatedVariable: elements/CalculatedVariable.md
    - NonMeasuredVariable: elements/NonMeasuredVariable.md
    - DiscretePHVariable: elements/DiscretePHVariable.md
    - DiscreteTAVariable: elements/DiscreteTAVariable.md
    - DiscreteDICVariable: elements/DiscreteDICVariable.md
    - DiscreteCO2Variable: elements/DiscreteCO2Variable.md
    - HPLCVariable: elements/HPLCVariable.md
  - Instruments & Calibration:
    - instruments-calibration/index.md
    - AnalyzingInstrument: elements/AnalyzingInstrument.md
    - PHInstrument: elements/PHInstrument.md
    - CRMInstrument: elements/CRMInstrument.md
    - CO2GasDetector: elements/CO2GasDetector.md
    - Calibration: elements/Calibration.md
  - Controlled Vocabularies: vocabularies.md
  - Full Schema Index: elements/index.md
  - About: about.md

exclude_docs: |
  /templates-linkml/

site_url: https://submarine-mrv.github.io/oae-data-protocol
repo_url: https://github.com/submarine-mrv/oae-data-protocol

# Uncomment this block to enable use of Google Analytics.
# Replace the property value with your own ID.
# extra:
#   analytics:
#     provider: google
#     property: G-XXXXXXXXXX
