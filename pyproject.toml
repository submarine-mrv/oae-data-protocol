[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "oae_data_protocol"
description = "Base ontology and data schemas for ocean alkalinity enhancement projects, experiments, and field trials. This project aims to be a technical complement to Submarine Scientific's OAE Data Protocol, developed in conjunction with Carbon To Sea and NOAA."
authors = [
  {name = "Cory Levinson", email = "cjlevinson@gmail.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9,<3.13"
dynamic = ["version"]

dependencies = [
  "linkml-runtime ==1.8.3",
  "oaklib (>=0.6.23,<0.7.0)",
]

[dependency-groups]
dev = [
    "linkml==1.8.7",
    # oaklib pulls eutils, which imports pkg_resources; setuptools 82 removed it.
    "setuptools<81",
    "mkdocs-material>=8.2.8",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "mkdocs-pymdownx-material-extras>=2.5.6",
    "jupyter>=1.0.0",
    "mknotebooks>= 0.8.0",
    "schemasheets>=0.1.14",
]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "ontologies/*",
  "src/oae_data_protocol/datamodel/oae_data_protocol_pydantic.py",
]

# Reminder: words have to be lowercased for the ignore-words-list
# equil: NERC L05 CURIE token (SDN_L05:EQUIL), not a misspelling of "equal"
ignore-words-list = "linke,equil"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"
EQUIL = "EQUIL"  # NERC L05 CURIE token (SDN_L05:EQUIL), not a misspelling of "equal"
[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/oae_data_protocol/datamodel/oae_data_protocol_pydantic.py",
]
